<!DOCTYPE html>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.contact-box{
background:#f5e6d3;
width:100%;
max-width:600px;
padding:45px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

h1{
font-family:'Playfair Display',serif;
font-size:45px;
color:#2b1b14;
margin-bottom:15px;
}

.tagline{
color:#6b4d3d;
font-size:16px;
margin-bottom:30px;
}

.info{
text-align:left;
background:white;
padding:20px;
border-radius:15px;
margin-bottom:25px;
}

.info p{
margin:12px 0;
font-size:16px;
color:#333;
}

.btn{
display:inline-block;
padding:14px 30px;
margin:8px;
background:#2b1b14;
color:white;
text-decoration:none;
border-radius:30px;
font-weight:600;
transition:0.3s;
}

.btn:hover{
transform:translateY(-4px);
box-shadow:0 8px 20px rgba(0,0,0,0.25);
background:#1a100b;
}

.footer{
margin-top:20px;
font-size:14px;
color:#666;
}

</style>
</head>
