<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Page - Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:#fff;
}

/* HEADER */
header{
text-align:center;
padding:20px;
font-family:'Playfair Display',serif;
font-size:28px;
color:#f5e6d3;
}

/* BOX */
.box{
max-width:600px;
margin:30px auto;
background:#f5e6d3;
color:#2b1b14;
padding:20px;
border-radius:15px;
box-shadow:0 6px 15px rgba(0,0,0,0.4);
}

.item{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #ddd;
}

.total{
text-align:right;
font-size:20px;
font-weight:bold;
margin-top:15px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#2b1b14;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1a0f0b;
}

.empty{
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header>
☕ Drip Cafe Order
</header>

<div class="box" id="orderBox"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};

let box = document.getElementById("orderBox");

let total = 0;
let hasItems = false;

for(let item in cart){

if(cart[item].qty > 0){

hasItems = true;

let itemTotal = cart[item].price * cart[item].qty;
total += itemTotal;

box.innerHTML += `
<div class="item">
<span>${item} x ${cart[item].qty}</span>
<span>₹${itemTotal}</span>
</div>
`;
}
}

if(!hasItems){
box.innerHTML = "<div class='empty'>Your cart is empty ☕</div>";
}
else{
box.innerHTML += `
<div class="total">Total: ₹${total}</div>
<button onclick="placeOrder()">Place Order</button>
`;
}

function placeOrder(){
alert("🎉 Order placed successfully! Thank you ☕");

localStorage.removeItem("cart");

window.location.href = "menu.html";
}

</script>

</body>
</html>
