<!DOCTYPE html>
<html>
<head>
    <title>Order Confirmed</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #3b2f2f, #6f4e37);
            color: white; 
            text-align: center;
        }

        .box {
            margin-top: 120px;
            padding: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            max-width: 400px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #c8a97e;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎉 Thank You!</h1>
    <p>Your order has been placed successfully ☕</p>

    <div class="card">
        <h2>☕ Drip cafe</h2>
        <p>Order Status: Preparing...</p>
        <p>Estimated Time: 5–10 mins</p>
    </div>

    <button onclick="window.location.href='index.html'">
        Back to Menu
    </button>

</div>

</body>
</html>
