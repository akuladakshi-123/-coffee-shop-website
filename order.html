<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary - Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.box{
max-width:700px;
margin:auto;
background:#f5e6d3;
color:#2b1b14;
padding:20px;
border-radius:20px;
}

.item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #ddd;
}

.total{
text-align:right;
font-size:22px;
font-weight:bold;
margin-top:15px;
}

.actions{
display:flex;
gap:10px;
margin-top:20px;
}

.btn{
flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.menu{ background:#2b1b14; color:white; }
.pay{ background:#2e7d32; color:white; }
.back{ background:#c62828; color:white; }

.empty{
text-align:center;
padding:20px;
font-size:18px;
}
</style>
</head>

<body>

<h1>☕ Order Summary</h1>

<div class="box" id="box"></div>

<script>

// 🧠 SAFE LOAD
let cart = JSON.parse(localStorage.getItem("cart")) || {};

// 📊 RENDER
function render(){

let box = document.getElementById("box");
box.innerHTML = "";

let total = 0;
let hasItems = false;

Object.keys(cart).forEach(item => {

let data = cart[item];
if(!data || data.qty <= 0) return;

hasItems = true;

let itemTotal = data.price * data.qty;
total += itemTotal;

box.innerHTML += `
<div class="item">
  <span>${item} × ${data.qty}</span>
  <span>₹${itemTotal}</span>
</div>
`;
});

if(!hasItems){
box.innerHTML = `<div class="empty">☕ No items in order</div>`;
return;
}

box.innerHTML += `
<div class="total">Total: ₹${total}</div>

<div class="actions">
<button class="btn menu" onclick="goMenu()">Add More</button>
<button class="btn pay" onclick="goPayment()">Proceed to Payment</button>
<button class="btn back" onclick="goCart()">Back</button>
</div>
`;
}

// 🏠 NAVIGATION
function goMenu(){
window.location.href = "menu.html";
}

function goCart(){
window.location.href = "cart.html";
}

function goPayment(){
window.location.href = "payment.html";
}

render();

</script>

</body>
</html>
