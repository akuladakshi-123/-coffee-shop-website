<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary - Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#1f120d;
color:white;
padding:15px;
}

h1{
text-align:center;
font-size:20px;
margin-bottom:15px;
}

/* BOX */
.box{
max-width:600px;
margin:auto;
background:#2b1b14;
padding:15px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* ITEMS */
.item{
display:flex;
justify-content:space-between;
padding:12px;
border-bottom:1px solid rgba(255,255,255,0.1);
transition:0.2s;
}

.item:hover{
transform:scale(1.01);
}

/* TOTAL */
.total{
text-align:right;
font-size:20px;
font-weight:700;
margin-top:15px;
}

/* BUTTON AREA */
.actions{
display:flex;
gap:10px;
margin-top:20px;
}

.btn{
flex:1;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

.menu{ background:#ffcc70; color:#2b1b14; }
.pay{ background:#2e7d32; color:white; }
.back{ background:#c62828; color:white; }

/* EMPTY */
.empty{
text-align:center;
padding:20px;
opacity:0.8;
}

</style>
</head>

<body>

<h1>🧾 Order Summary</h1>

<div class="box" id="box"></div>

<script>

// 🧠 LOAD CART
let cart = JSON.parse(localStorage.getItem("cart")) || {};

// 📊 RENDER ORDER
function render(){

let box = document.getElementById("box");
box.innerHTML = "";

let total = 0;
let hasItems = false;

Object.keys(cart).forEach(item => {

let data = cart[item];
if(!data || data.qty <= 0) return;

hasItems = true;

let itemTotal = data.price * data.qty;
total += itemTotal;

box.innerHTML += `
<div class="item">
  <span>${item} × ${data.qty}</span>
  <span>₹${itemTotal}</span>
</div>
`;
});

if(!hasItems){
box.innerHTML = `<div class="empty">☕ No items in order</div>`;
return;
}

box.innerHTML += `
<div class="total">Total: ₹${total}</div>

<div class="actions">
<button class="btn menu" onclick="goMenu()">Add More</button>
<button class="btn pay" onclick="goPayment()">Proceed to Payment</button>
<button class="btn back" onclick="goCart()">Back</button>
</div>
`;
}

// 🏠 NAVIGATION
function goMenu(){
window.location.href = "menu.html";
}

function goCart(){
window.location.href = "cart.html";
}

function goPayment(){
window.location.href = "payment.html";
}

render();

</script>

</body>
</html>
