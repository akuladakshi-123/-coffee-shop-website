<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Cart</title>

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:white;
}

h1{
text-align:center;
padding:20px;
font-family:'Playfair Display',serif;
}

.box{
max-width:650px;
margin:auto;
background:#f5e6d3;
color:#2b1b14;
padding:20px;
border-radius:15px;
box-shadow:0 6px 15px rgba(0,0,0,0.4);
}

.item{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #ddd;
}

.total{
text-align:right;
font-size:20px;
font-weight:bold;
margin-top:15px;
}

/* BUTTONS */
.buttons{
display:flex;
gap:10px;
margin-top:20px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.add{
background:#2b1b14;
color:white;
}

.order{
background:green;
color:white;
}

.clear{
background:red;
color:white;
}

.empty{
text-align:center;
padding:20px;
font-weight:bold;
}

</style>
</head>

<body>

<h1>🛒 Your Cart</h1>

<div class="box" id="box"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};
let box = document.getElementById("box");

let total = 0;
let hasItems = false;

// SHOW ITEMS (ALL 10 ITEMS FROM MENU)
for(let item in cart){

if(cart[item].qty > 0){

hasItems = true;

let itemTotal = cart[item].price * cart[item].qty;
total += itemTotal;

box.innerHTML += `
<div class="item">
<span>${item} x ${cart[item].qty}</span>
<span>₹${itemTotal}</span>
</div>
`;
}
}

// IF EMPTY CART
if(!hasItems){
box.innerHTML = `<div class="empty">Your cart is empty ☕</div>`;
}
else{

box.innerHTML += `
<div class="total">Total: ₹${total}</div>

<div class="buttons">

<button class="add" onclick="goMenu()">Add More</button>



<button class="clear" onclick="clearCart()">Clear Cart</button>

</div>
`;
}

// FUNCTIONS
function goMenu(){
window.location.href = "menu.html";
}



function clearCart(){
localStorage.removeItem("cart");
location.reload();
}

</script>

</body>
</html>
