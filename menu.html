<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:white;
padding:20px;
}

h1{
text-align:center;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#f5e6d3;
color:#2b1b14;
padding:15px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

button{
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2b1b14;
color:white;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
}

.cartBtn{
background:#ffcc70;
color:#2b1b14;
padding:10px 15px;
border-radius:20px;
font-weight:600;
cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
<h2>☕ Drip Cafe Menu</h2>
<div class="cartBtn" onclick="goCart()">View Cart 🛒</div>
</div>

<div class="menu">

<div class="card">
<h3>Latte</h3>
<p>₹120</p>
<button onclick="addToCart('Latte',120)">Add</button>
</div>

<div class="card">
<h3>Cappuccino</h3>
<p>₹140</p>
<button onclick="addToCart('Cappuccino',140)">Add</button>
</div>

<div class="card">
<h3>Espresso</h3>
<p>₹100</p>
<button onclick="addToCart('Espresso',100)">Add</button>
</div>

</div>

<script>

// 🧠 CART BRAIN
let cart = JSON.parse(localStorage.getItem("cart")) || {};

// ➕ ADD TO CART
function addToCart(name, price){

if(!cart[name]){
cart[name] = {price:price, qty:1};
}
else{
cart[name].qty += 1;
}

localStorage.setItem("cart", JSON.stringify(cart));

alert(name + " added ☕");
}

// 🛒 GO TO CART
function goCart(){
window.location.href = "cart.html";
}

</script>

</body>
</html>
