<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ✨ FLYING ANIMATION */
.flying-item{
  position:fixed;
  width:12px;
  height:12px;
  background:#ffcc70;
  border-radius:50%;
  z-index:9999;
  pointer-events:none;
  transition:all 0.8s ease;
}

body{
margin:0;
font-family:Poppins;
background:#1f120d;
color:white;
padding:15px;
}

h1{
text-align:center;
font-size:20px;
margin-bottom:15px;
}

/* MENU GRID */
.menu{
display:grid;
grid-template-columns:1fr;
gap:12px;
padding-bottom:80px;
}

/* CARD */
.card{
background:#2b1b14;
border-radius:15px;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* STAR */
.star{
position:absolute;
top:8px;
right:10px;
background:#ffcc70;
color:#2b1b14;
padding:3px 8px;
border-radius:20px;
font-size:11px;
font-weight:600;
}

/* LEFT */
.left h3{
margin:0;
font-size:15px;
}

.left p{
margin:0;
font-size:13px;
opacity:0.8;
}

/* CONTROL BUTTONS */
.controls{
display:flex;
align-items:center;
gap:8px;
}

.controls button{
background:#ffcc70;
border:none;
padding:5px 10px;
border-radius:8px;
font-weight:700;
cursor:pointer;
color:#2b1b14;
}

.controls span{
min-width:20px;
text-align:center;
font-weight:600;
}

/* TOAST */
#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#2b1b14;
color:white;
padding:12px 20px;
border-radius:20px;
opacity:0;
transition:0.3s;
}

/* BOTTOM BAR */
.bottomBar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#ffcc70;
color:#2b1b14;
display:flex;
justify-content:center;
padding:12px;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<h1>☕ Drip Cafe Menu</h1>

<div class="menu">

<!-- LATTE -->
<div class="card">
<div class="left">
<h3>Latte ⭐</h3>
<p>₹120</p>
</div>

<div class="controls">
<button onclick="decItem('Latte')">-</button>
<span id="Latte-qty">0</span>
<button onclick="incItem('Latte',120)">+</button>
</div>
</div>

<!-- CAPPUCCINO -->
<div class="card">
<div class="left">
<h3>Cappuccino ⭐</h3>
<p>₹140</p>
</div>

<div class="controls">
<button onclick="decItem('Cappuccino')">-</button>
<span id="Cappuccino-qty">0</span>
<button onclick="incItem('Cappuccino',140)">+</button>
</div>
</div>

<!-- ESPRESSO -->
<div class="card">
<div class="left">
<h3>Espresso</h3>
<p>₹100</p>
</div>

<div class="controls">
<button onclick="decItem('Espresso')">-</button>
<span id="Espresso-qty">0</span>
<button onclick="incItem('Espresso',100)">+</button>
</div>
</div>

<!-- MOCHA -->
<div class="card">
<div class="left">
<h3>Mocha ⭐</h3>
<p>₹150</p>
</div>

<div class="controls">
<button onclick="decItem('Mocha')">-</button>
<span id="Mocha-qty">0</span>
<button onclick="incItem('Mocha',150)">+</button>
</div>
</div>

</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- BOTTOM CART -->
<div class="bottomBar" onclick="goCart()">
🛒 View Cart - <span id="count">0</span>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};

function save(){
localStorage.setItem("cart", JSON.stringify(cart));
}

// ➕ INCREASE
function incItem(name, price){

if(!cart[name]){
cart[name] = {price:price, qty:1};
}else{
cart[name].qty++;
}

save();
updateUI(name);
updateCount();
}

// ➖ DECREASE
function decItem(name){

if(cart[name]){
cart[name].qty--;

if(cart[name].qty <= 0){
delete cart[name];
}
}

save();
updateUI(name);
updateCount();
}

// 🔄 UPDATE UI
function updateUI(name){
let el = document.getElementById(name + "-qty");
el.innerText = cart[name] ? cart[name].qty : 0;
}

// 🛒 COUNT
function updateCount(){
let count = 0;
for(let i in cart){
count += cart[i].qty;
}
document.getElementById("count").innerText = count;
}

function goCart(){
window.location.href="cart.html";
}

updateCount();

</script>

</body>
</html>
