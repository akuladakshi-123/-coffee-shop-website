<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#1f120d;
color:white;
padding:15px;
}

h1{
text-align:center;
font-size:20px;
margin-bottom:15px;
}

/* MENU */
.menu{
display:grid;
grid-template-columns:1fr;
gap:12px;
padding-bottom:80px;
}

/* CARD */
.card{
background:#2b1b14;
border-radius:15px;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* LEFT */
.left h3{
margin:0;
font-size:15px;
}

.left p{
margin:0;
font-size:13px;
opacity:0.8;
}

/* CONTROLS */
.controls{
display:flex;
align-items:center;
gap:8px;
}

.controls button{
background:#ffcc70;
border:none;
padding:5px 10px;
border-radius:8px;
font-weight:700;
cursor:pointer;
color:#2b1b14;
}

.controls span{
min-width:20px;
text-align:center;
font-weight:600;
}

/* BOTTOM BAR */
.bottomBar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#ffcc70;
color:#2b1b14;
display:flex;
justify-content:center;
padding:12px;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<h1>☕ Drip Cafe Menu</h1>

<div class="menu">

<!-- COFFEE ITEMS -->
<div class="card">
<div class="left">
<h3>Latte ⭐</h3>
<p>₹120</p>
</div>
<div class="controls">
<button onclick="decItem('Latte')">-</button>
<span id="Latte-qty">0</span>
<button onclick="incItem('Latte',120)">+</button>
</div>
</div>

<div class="card">
<div class="left">
<h3>Cappuccino ⭐</h3>
<p>₹140</p>
</div>
<div class="controls">
<button onclick="decItem('Cappuccino')">-</button>
<span id="Cappuccino-qty">0</span>
<button onclick="incItem('Cappuccino',140)">+</button>
</div>
</div>

<div class="card">
<div class="left">
<h3>Espresso</h3>
<p>₹100</p>
</div>
<div class="controls">
<button onclick="decItem('Espresso')">-</button>
<span id="Espresso-qty">0</span>
<button onclick="incItem('Espresso',100)">+</button>
</div>
</div>

<div class="card">
<div class="left">
<h3>Mocha ⭐</h3>
<p>₹150</p>
</div>
<div class="controls">
<button onclick="decItem('Mocha')">-</button>
<span id="Mocha-qty">0</span>
<button onclick="incItem('Mocha',150)">+</button>
</div>
</div>

<div class="card">
<div class="left">
<h3>Americano</h3>
<p>₹110</p>
</div>
<div class="controls">
<button onclick="decItem('Americano')">-</button>
<span id="Americano-qty">0</span>
<button onclick="incItem('Americano',110)">+</button>
</div>
</div>

<!-- SNACKS -->
<div class="card">
<div class="left">
<h3>Sandwich ⭐</h3>
<p>₹80</p>
</div>
<div class="controls">
<button onclick="decItem('Sandwich')">-</button>
<span id="Sandwich-qty">0</span>
<button onclick="incItem('Sandwich',80)">+</button>
</div>
</div>

<div class="card">
<div class="left">
<h3>French Fries</h3>
<p>₹90</p>
</div>
<div class="controls">
<button onclick="decItem('Fries')">-</button>
<span id="Fries-qty">0</span>
<button onclick="incItem('Fries',90)">+</button>
</div>
</div>

<div class="card">
<div class="left">
<h3>Brownie ⭐</h3>
<p>₹130</p>
</div>
<div class="controls">
<button onclick="decItem('Brownie')">-</button>
<span id="Brownie-qty">0</span>
<button onclick="incItem('Brownie',130)">+</button>
</div>
</div>

<div class="card">
<div class="left">
<h3>Donut</h3>
<p>₹70</p>
</div>
<div class="controls">
<button onclick="decItem('Donut')">-</button>
<span id="Donut-qty">0</span>
<button onclick="incItem('Donut',70)">+</button>
</div>
</div>

<div class="card">
<div class="left">
<h3>Cold Coffee ⭐</h3>
<p>₹150</p>
</div>
<div class="controls">
<button onclick="decItem('Cold Coffee')">-</button>
<span id="Cold Coffee-qty">0</span>
<button onclick="incItem('Cold Coffee',150)">+</button>
</div>
</div>

</div>

<!-- BOTTOM CART -->
<div class="bottomBar" onclick="goOrder()">
🧾 Proceed to Order - <span id="count">0</span>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};

function save(){
localStorage.setItem("cart", JSON.stringify(cart));
}

// ➕
function incItem(name, price){
if(!cart[name]){
cart[name] = {price:price, qty:1};
}else{
cart[name].qty++;
}
save();
updateUI(name);
updateCount();
}

// ➖
function decItem(name){
if(cart[name]){
cart[name].qty--;
if(cart[name].qty <= 0){
delete cart[name];
}
}
save();
updateUI(name);
updateCount();
}

// UI update
function updateUI(name){
let el = document.getElementById(name + "-qty");
el.innerText = cart[name] ? cart[name].qty : 0;
}

// count
function updateCount(){
let count = 0;
for(let i in cart){
count += cart[i].qty;
}
document.getElementById("count").innerText = count;
}

function goCart(){
window.location.href="cart.html";
}

function goOrder(){
window.location.href = "order.html";
}

updateCount();



</script>

</body>
</html>
