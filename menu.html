<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

flying-item{
  position:fixed;
  width:12px;
  height:12px;
  background:#ffcc70;
  border-radius:50%;
  z-index:9999;
  pointer-events:none;
  transition:all 0.8s ease;
}
body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#f5e6d3;
color:#2b1b14;
padding:15px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
position:relative;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.star{
position:absolute;
top:10px;
right:10px;
background:#ffcc70;
padding:5px 8px;
border-radius:20px;
font-size:12px;
font-weight:600;
}

/* BUTTON */
button{
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2b1b14;
color:white;
font-weight:600;
}

/* CART BUTTON */
.cartBtn{
background:#ffcc70;
color:#2b1b14;
padding:10px 15px;
border-radius:20px;
font-weight:600;
cursor:pointer;
position:fixed;
top:20px;
right:20px;
}

/* TOAST */
#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#2b1b14;
color:white;
padding:12px 20px;
border-radius:20px;
opacity:0;
transition:0.3s;
}
</style>
</head>

<body>

<h1>☕ Drip Cafe Menu</h1>

<div class="cartBtn" onclick="goCart()">View Cart 🛒</div>

<div class="menu">

<!-- COFFEE -->
<div class="card">
<div class="star">⭐ Popular</div>
<h3>Latte</h3>
<p>₹120</p>
<button onclick="addToCart('Latte',120)">Add</button>
</div>

<div class="card">
<div class="star">⭐ Popular</div>
<h3>Cappuccino</h3>
<p>₹140</p>
<button onclick="addToCart('Cappuccino',140)">Add</button>
</div>

<div class="card">
<h3>Espresso</h3>
<p>₹100</p>
<button onclick="addToCart('Espresso',100)">Add</button>
</div>

<div class="card">
<div class="star">⭐ New</div>
<h3>Mocha</h3>
<p>₹150</p>
<button onclick="addToCart('Mocha',150)">Add</button>
</div>

<div class="card">
<h3>Americano</h3>
<p>₹110</p>
<button onclick="addToCart('Americano',110)">Add</button>
</div>

<!-- SNACKS -->
<div class="card">
<div class="star">⭐ Popular</div>
<h3>Sandwich</h3>
<p>₹80</p>
<button onclick="addToCart('Sandwich',80)">Add</button>
</div>

<div class="card">
<h3>French Fries</h3>
<p>₹90</p>
<button onclick="addToCart('Fries',90)">Add</button>
</div>

<div class="card">
<div class="star">⭐ Hot</div>
<h3>Brownie</h3>
<p>₹130</p>
<button onclick="addToCart('Brownie',130)">Add</button>
</div>

<div class="card">
<h3>Donut</h3>
<p>₹70</p>
<button onclick="addToCart('Donut',70)">Add</button>
</div>

<div class="card">
<div class="star">⭐ Bestseller</div>
<h3>Cold Coffee</h3>
<p>₹150</p>
<button onclick="addToCart('Cold Coffee',150)">Add</button>
</div>

</div>

<!-- TOAST -->
<div id="toast"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};

function save(){
localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name, price){

if(!cart[name]){
cart[name] = {price:price, qty:1};
}else{
cart[name].qty += 1;
}

save();
showToast(name + " added ☕");
}

function goCart(){
window.location.href = "cart.html";
}

function showToast(msg){
let t = document.getElementById("toast");
t.innerText = msg;
t.style.opacity = 1;

setTimeout(()=>{
t.style.opacity = 0;
},1200);
}

</script>

</body>
</html>
