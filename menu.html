<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background: linear-gradient(135deg, #2b1b14, #5a3a2b);
color:#fff;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 50px;
background:#2b1b14;
}

.logo{
font-size:30px;
font-family:'Playfair Display',serif;
color:#f5e6d3;
}

nav ul{
display:flex;
list-style:none;
gap:25px;
}

nav a{
text-decoration:none;
color:#f5e6d3;
font-weight:500;
}

nav a:hover{
color:#d9a86c;
}

/* TITLE */
.menu-title{
text-align:center;
padding:40px 20px;
}

.menu-title h1{
font-size:50px;
font-family:'Playfair Display',serif;
}

.menu-title p{
color:#e6d3c2;
margin-top:10px;
}

/* MENU GRID */
.menu-container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
padding:20px;
}

/* CARD */
.card{
background:#f5e6d3;
color:#2b1b14;
width:260px;
border-radius:15px;
overflow:hidden;
box-shadow:0 6px 15px rgba(0,0,0,0.4);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:15px;
text-align:center;
}

.price{
font-weight:bold;
margin:10px 0;
}

/* BUTTONS */
button{
padding:8px 12px;
border:none;
border-radius:8px;
background:#5a3a2b;
color:white;
cursor:pointer;
margin:3px;
}

button:hover{
background:#3b241a;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
color:#f5e6d3;
}

</style>
</head>

<body>

<header>
<div class="logo">☕ Drip Cafe</div>

<nav>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="menu.html">Menu</a></li>
<li><a href="#" onclick="goToCart()">Cart 🛒</a></li>
</ul>
</nav>
</header>

<section class="menu-title">
<h1>Our Menu ☕</h1>
<p>Fresh brewed happiness</p>
</section>

<section class="menu-container">

<!-- CARD 1 -->
<div class="card">
<img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600">
<div class="card-content">
<h3>Espresso</h3>
<p class="price">₹120</p>
<button onclick="addToCart('Espresso',120,1)">Add 1</button>
<button onclick="addToCart('Espresso',120,2)">Add 2</button>
</div>
</div>

<!-- CARD 2 -->
<div class="card">
<img src="https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=600">
<div class="card-content">
<h3>Cappuccino</h3>
<p class="price">₹180</p>
<button onclick="addToCart('Cappuccino',180,1)">Add 1</button>
<button onclick="addToCart('Cappuccino',180,2)">Add 2</button>
</div>
</div>

<!-- CARD 3 -->
<div class="card">
<img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600">
<div class="card-content">
<h3>Americano</h3>
<p class="price">₹150</p>
<button onclick="addToCart('Americano',150,1)">Add 1</button>
<button onclick="addToCart('Americano',150,2)">Add 2</button>
</div>
</div>

</section>

<footer>
© 2026 Drip Cafe | Coffee with love ☕
</footer>

<script>

let cart = [];

function addToCart(name, price, qty){
cart.push({name, price, qty});
alert(qty + " " + name + " added ☕");
}

function goToCart(){

if(cart.length === 0){
alert("Cart is empty 🛒");
return;
}

let total = 0;
let msg = "Your Cart:\n\n";

cart.forEach(item=>{
let itemTotal = item.price * item.qty;
msg += item.name + " x " + item.qty + " = ₹" + itemTotal + "\n";
total += itemTotal;
});

msg += "\nTotal: ₹" + total;

alert(msg);
}

</script>

</body>
</html>
