<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:#fff;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:#2b1b14;
}

.logo{
font-size:28px;
font-family:'Playfair Display',serif;
color:#f5e6d3;
}

.menu-container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:#f5e6d3;
color:#2b1b14;
width:250px;
border-radius:15px;
overflow:hidden;
box-shadow:0 6px 15px rgba(0,0,0,0.4);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.card-content{
padding:15px;
text-align:center;
}

.price{
font-weight:bold;
margin:8px 0;
}

/* QTY BUTTONS */
.qty-box{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:10px;
}

button{
padding:6px 10px;
border:none;
border-radius:6px;
background:#5a3a2b;
color:white;
cursor:pointer;
}

button:hover{
background:#3b241a;
}

/* VIEW CART */
.view-cart{
text-align:center;
padding:20px;
}

.view-cart button{
padding:12px 25px;
font-size:16px;
background:#1f120d;
border-radius:10px;
}

</style>
</head>

<body>

<header>
<div class="logo">☕ Drip Cafe</div>
</header>

<section class="menu-container">

<!-- ESPRESSO -->
<div class="card">
<img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600">
<div class="card-content">
<h3>Espresso</h3>
<p class="price">₹120</p>

<div class="qty-box">
<button onclick="changeQty('Espresso',120,-1)">-</button>
<span id="Espresso">0</span>
<button onclick="changeQty('Espresso',120,1)">+</button>
</div>

</div>
</div>

<!-- CAPPUCCINO -->
<div class="card">
<img src="https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=600">
<div class="card-content">
<h3>Cappuccino</h3>
<p class="price">₹180</p>

<div class="qty-box">
<button onclick="changeQty('Cappuccino',180,-1)">-</button>
<span id="Cappuccino">0</span>
<button onclick="changeQty('Cappuccino',180,1)">+</button>
</div>

</div>
</div>

</section>

<!-- VIEW CART BUTTON -->
<div class="view-cart">
<button onclick="viewCart()">🛒 View Cart</button>
</div>

<script>

let cart = {};

function changeQty(name, price, change){

if(!cart[name]){
cart[name] = {price:price, qty:0};
}

cart[name].qty += change;

if(cart[name].qty < 0){
cart[name].qty = 0;
}

document.getElementById(name).innerText = cart[name].qty;
}

function viewCart(){

localStorage.setItem("cart", JSON.stringify(cart));
window.location.href = "cart.html";
}

</script>

</body>
</html>
