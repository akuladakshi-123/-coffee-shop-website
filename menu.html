<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background: linear-gradient(135deg, #2b1b14, #5a3a2b);
color:#fff;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 50px;
background:#2b1b14;
}

.logo{
font-size:30px;
font-family:'Playfair Display',serif;
color:#f5e6d3;
}

nav ul{
display:flex;
list-style:none;
gap:25px;
}

nav a{
text-decoration:none;
color:#f5e6d3;
}

.menu-title{
text-align:center;
padding:30px;
}

.menu-title h1{
font-size:50px;
font-family:'Playfair Display',serif;
}

/* MENU */
.menu-container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
padding:20px;
}

/* CARD */
.card{
background:#f5e6d3;
color:#2b1b14;
width:260px;
border-radius:15px;
overflow:hidden;
box-shadow:0 6px 15px rgba(0,0,0,0.4);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:15px;
text-align:center;
}

.price{
font-weight:bold;
margin:10px 0;
}

/* QTY */
.qty-box{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:10px;
}

button{
padding:6px 10px;
border:none;
border-radius:6px;
background:#5a3a2b;
color:white;
cursor:pointer;
}

button:hover{
background:#3b241a;
}

.qty{
font-weight:bold;
font-size:18px;
}

/* CART BUTTON */
.cart-btn{
text-align:center;
padding:30px;
}

.cart-btn button{
padding:12px 25px;
font-size:16px;
border-radius:10px;
background:#1f120d;
}

</style>
</head>

<!-- CART -->
<div class="cart-btn">
<button onclick="goToCart()">🛒 Go to Cart</button>
</div>

<script>

let cart = {};

function changeQty(name, price, change){

if(!cart[name]){
cart[name] = {price:price, qty:0};
}

cart[name].qty += change;

if(cart[name].qty < 0){
cart[name].qty = 0;
}

document.getElementById(name).innerText = cart[name].qty;
}

function goToCart(){

let total = 0;
let msg = "Your Cart:\n\n";

for(let item in cart){
if(cart[item].qty > 0){
let itemTotal = cart[item].price * cart[item].qty;
msg += item + " x " + cart[item].qty + " = ₹" + itemTotal + "\n";
total += itemTotal;
}
}

if(total === 0){
alert("Cart is empty 🛒");
return;
}

msg += "\nTotal: ₹" + total;

alert(msg);
}

</script>
