<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Bill</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#f5e6d3;
padding:25px;
border-radius:18px;
width:320px;
text-align:center;
color:#2b1b14;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

h2{
margin-bottom:5px;
}

.info{
font-size:14px;
margin:8px 0;
}

.amount{
font-size:20px;
font-weight:bold;
margin:10px 0;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.pay{
background:green;
color:white;
}

.pay:hover{
background:darkgreen;
}

.cancel{
background:#ddd;
}

</style>
</head>

<body>

<div class="box">

<h2>💳 Pay Bill</h2>

<p class="info">Complete your order payment</p>

<div id="bill"></div>

<button class="pay" onclick="paid()">Pay Now</button>
<button class="cancel" onclick="goBack()">Back</button>

</div>

<script>

// LOAD CART
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let bill = document.getElementById("bill");

let total = 0;

for(let item in cart){
let price = cart[item].price * cart[item].qty;
total += price;

bill.innerHTML += `<div>${item} x ${cart[item].qty} = ₹${price}</div>`;
}

bill.innerHTML += `<div class="amount">Total: ₹${total}</div>`;

// PAYMENT DONE
function paid(){
localStorage.removeItem("cart");
window.location.href = "successful.html";
}

// BACK
function goBack(){
window.location.href = "order.html";
}

</script>

</body>
</html>
