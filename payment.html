<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Processing Screen</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

/* BIG SCREEN */
.screen{
width:700px;
height:420px;
background:#1f120d;
border-radius:18px;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
padding:30px;
position:relative;
overflow:hidden;
}

/* TOP BAR */
.top{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.1);
padding-bottom:15px;
}

.brand{
font-size:18px;
font-weight:600;
color:#ffcc70;
}

.status{
font-size:13px;
opacity:0.8;
letter-spacing:2px;
}

/* CENTER CONTENT */
.center{
text-align:center;
margin-top:40px;
}

.big-text{
font-size:26px;
font-weight:600;
}

.sub-text{
margin-top:10px;
font-size:14px;
opacity:0.7;
}

/* QR SECTION */
.qr{
width:180px;
height:180px;
margin:25px auto;
background:white;
padding:10px;
border-radius:10px;
}

.qr img{
width:100%;
height:100%;
}

/* ANIMATED LOADER BAR (LIKE KFC SCREEN) */
.loader{
width:80%;
height:6px;
background:#2b1b14;
margin:25px auto;
border-radius:10px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#ffcc70;
animation:load 3s linear forwards;
}

@keyframes load{
0%{width:0%;}
100%{width:100%;}
}

/* FOOTER */
.footer{
position:absolute;
bottom:20px;
left:0;
right:0;
text-align:center;
font-size:12px;
opacity:0.6;
}

</style>
</head>

<body>

<div class="screen">

<div class="top">
<div class="brand">☕ DRIP CAFE SYSTEM</div>
<div class="status">PAYMENT PROCESSING</div>
</div>

<div class="center">

<div class="big-text">Scan & Pay at Counter</div>

<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=DripCafePayment" />
</div>

<div class="sub-text">Please complete payment using UPI</div>

</div>

<div class="loader">
<div class="fill"></div>
</div>

<div class="footer">
Transaction is being verified automatically...
</div>

</div>

<script>

// GET TOTAL (optional but good UX)
let cart = JSON.parse(localStorage.getItem("cart")) || {};

let total = 0;
for(let i in cart){
total += cart[i].price * cart[i].qty;
}

// AUTO COMPLETE AFTER SCREEN FINISH
setTimeout(()=>{
localStorage.removeItem("cart");
window.location.href = "successful.html";
}, 3200);

</script>

</body>
</html>
