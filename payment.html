<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#0b0b0b;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* MAIN CARD */
.card{
width:320px;
background:#141414;
border-radius:18px;
padding:25px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

/* ICON AREA */
.icon{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:#1f1f1f;
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
}

/* PULSE */
.icon::before{
content:"";
position:absolute;
width:100%;
height:100%;
border-radius:50%;
background:#00ff9d;
opacity:0.2;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{transform:scale(0.8); opacity:0.3;}
50%{transform:scale(1.4); opacity:0;}
100%{transform:scale(0.8); opacity:0.3;}
}

/* CHECK ANIMATION */
.check{
font-size:40px;
color:#00ff9d;
z-index:2;
}

/* TEXT */
h2{
margin-top:15px;
font-size:18px;
font-weight:600;
}

p{
font-size:12px;
opacity:0.7;
margin-top:6px;
}

/* LOADING BAR */
.bar{
margin-top:20px;
height:5px;
background:#2a2a2a;
border-radius:10px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00ff9d;
animation:fill 2.5s linear forwards;
}

@keyframes fill{
0%{width:0%;}
100%{width:100%;}
}

/* DOTS */
.dots{
margin-top:10px;
font-size:18px;
letter-spacing:4px;
animation:blink 1s infinite;
color:#00ff9d;
}

@keyframes blink{
0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}
}

</style>
</head>

<body>

<div class="card">

<div class="icon">
<div class="check">✓</div>
</div>

<h2>Processing Payment</h2>
<p>Secure UPI verification in progress</p>

<div class="bar">
<div class="fill"></div>
</div>

<div class="dots">● ● ●</div>

</div>

<script>

setTimeout(() => {
localStorage.removeItem("cart");
window.location.href = "successful.html";
}, 2500);

</script>

</body>
</html>
