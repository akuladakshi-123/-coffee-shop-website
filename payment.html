<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#0f0a08;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1f120d;
padding:25px;
border-radius:20px;
width:320px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* TITLE */
h2{
color:#ffcc70;
margin-bottom:10px;
}

/* QR FRAME */
.qr-frame{
width:200px;
height:200px;
margin:auto;
border-radius:15px;
background:white;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

/* QR IMAGE */
.qr-frame img{
width:100%;
height:100%;
object-fit:cover;
}

/* SCANNER LINE */
.scan-line{
position:absolute;
width:100%;
height:4px;
background:#ffcc70;
top:0;
left:0;
animation:scan 1.5s infinite ease-in-out;
opacity:0.9;
}

@keyframes scan{
0%{top:0;}
50%{top:200px;}
100%{top:0;}
}

/* BLINKING DOTS */
.dots{
margin-top:15px;
font-size:18px;
letter-spacing:3px;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}
}

.small{
font-size:12px;
opacity:0.7;
margin-top:10px;
}

/* LOADING BAR */
.bar{
width:100%;
height:6px;
background:#2b1b14;
border-radius:10px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:#ffcc70;
animation:fill 3s linear forwards;
}

@keyframes fill{
0%{width:0%;}
100%{width:100%;}
}

</style>
</head>

<body>

<div class="box">

<h2>Processing Payment</h2>

<div class="qr-frame">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=DripCafePayment" />
<div class="scan-line"></div>
</div>

<div class="dots">● ● ●</div>

<p class="small">Verifying UPI / QR Payment</p>

<div class="bar">
<div class="fill"></div>
</div>

</div>

<script>

// AUTO SUCCESS AFTER 3 SECONDS
setTimeout(() => {
localStorage.removeItem("cart");
window.location.href = "successful.html";
}, 3000);

</script>

</body>
</html>
