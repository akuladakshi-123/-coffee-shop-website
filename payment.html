<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Bill</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#f5e6d3;
padding:30px;
border-radius:15px;
text-align:center;
color:#2b1b14;
width:300px;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
}

img{
width:200px;
border-radius:10px;
margin-top:15px;
}

button{
margin-top:20px;
padding:12px;
width:100%;
border:none;
border-radius:10px;
background:green;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

<h2>Scan & Pay ☕</h2>
<p>Use any UPI app</p>

<!-- SAMPLE QR (you can replace later with your UPI QR) -->
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi-payment-demo" alt="QR Code">

<button onclick="paid()">I Have Paid</button>

</div>

<script>

function paid(){
window.location.href = "successful.html";
}

</script>

</body>
</html>
