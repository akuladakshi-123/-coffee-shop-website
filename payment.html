<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
text-align:center;
background:#f5e6d3;
color:#2b1b14;
padding:30px;
border-radius:20px;
width:300px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.loader{
border:5px solid #ddd;
border-top:5px solid #2b1b14;
border-radius:50%;
width:50px;
height:50px;
margin:20px auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{ transform:rotate(360deg); }
}

.text{
font-weight:600;
margin-top:10px;
}

.success{
display:none;
}

.btn{
margin-top:15px;
padding:10px;
border:none;
border-radius:10px;
background:#2e7d32;
color:white;
cursor:pointer;
font-weight:600;
}
</style>
</head>

<body>

<div class="box">

<!-- LOADING -->
<div id="loading">
<div class="loader"></div>
<div class="text">Processing Payment...</div>
</div>

<!-- SUCCESS -->
<div id="success" class="success">
<h2>🎉 Payment Successful</h2>
<p>Your coffee is on the way ☕🚀</p>
<button class="btn" onclick="goHome()">Back to Home</button>
</div>

</div>

<script>

// 🧠 PAYMENT FLOW CONTROL
setTimeout(() => {

document.getElementById("loading").style.display = "none";
document.getElementById("success").style.display = "block";

// 🧹 CLEAR CART ONLY AFTER SUCCESS IS SHOWN
localStorage.removeItem("cart");

}, 3000);

// 🏠 HOME
function goHome(){
window.location.href = "index.html";
}

</script>

</body>
</html>
