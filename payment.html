<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Scanner Payment</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#1f120d;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
text-align:center;
background:#2b1b14;
padding:20px;
border-radius:20px;
width:340px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h2{
color:#ffcc70;
}

#reader{
width:300px;
margin:auto;
border-radius:12px;
overflow:hidden;
}

/* SUCCESS */
.success{
display:none;
}

.btn{
margin-top:15px;
padding:10px;
border:none;
border-radius:10px;
background:#2e7d32;
color:white;
cursor:pointer;
font-weight:600;
}

.small{
font-size:12px;
opacity:0.7;
margin-top:10px;
}

</style>
</head>

<body>

<div class="box">

<!-- SCANNER -->
<div id="scanner">
<h2>Scan to Pay ☕</h2>
<div id="reader"></div>
<p class="small">Point camera at QR code</p>
</div>

<!-- SUCCESS -->
<div id="success" class="success">
<h2>🎉 Payment Successful</h2>
<p>Your coffee is being prepared ☕🚀</p>
<button class="btn" onclick="home()">Back to Home</button>
</div>

</div>

<script>

let html5QrcodeScanner;

// start scanner
function startScanner(){

html5QrcodeScanner = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {

if (devices && devices.length) {

let cameraId = devices[0].id;

html5QrcodeScanner.start(
cameraId,
{
fps: 10,
qrbox: 250
},
(qrMessage) => {

// SUCCESS SCAN
console.log("QR:", qrMessage);

html5QrcodeScanner.stop();

document.getElementById("scanner").style.display = "none";
document.getElementById("success").style.display = "block";

localStorage.removeItem("cart");

},
(errorMessage) => {
// ignore scan errors
}
);

}
});

}

function home(){
window.location.href = "index.html";
}

startScanner();

</script>

</body>
</html>
