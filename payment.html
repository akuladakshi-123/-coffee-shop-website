<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Bill</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#f5e6d3;
padding:30px;
border-radius:18px;
width:320px;
text-align:center;
color:#2b1b14;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

h2{
margin-bottom:10px;
}

/* SCANNER ANIMATION BOX */
.scanner{
width:220px;
height:220px;
margin:15px auto;
border:3px solid #2b1b14;
border-radius:15px;
position:relative;
overflow:hidden;
background:#fff;
}

/* moving scan line */
.scanner::before{
content:"";
position:absolute;
width:100%;
height:4px;
background:#2ecc71;
animation:scan 2s linear infinite;
}

@keyframes scan{
0%{top:0;}
100%{top:100%;}
}

.summary{
text-align:left;
font-size:14px;
margin-top:10px;
}

.total{
font-weight:bold;
margin-top:10px;
text-align:right;
}

button{
width:100%;
margin-top:15px;
padding:12px;
border:none;
border-radius:10px;
background:green;
color:white;
font-size:15px;
cursor:pointer;
}

button:hover{
background:darkgreen;
}

</style>
</head>

<body>

<div class="box">

<h2>Scanning Payment ☕</h2>

<div class="scanner"></div>

<div class="summary" id="summary"></div>

<button onclick="paid()">I Have Paid</button>

</div>

<script>

// LOAD CART
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let summary = document.getElementById("summary");

let total = 0;

for(let item in cart){
let t = cart[item].price * cart[item].qty;
total += t;

summary.innerHTML += `<div>${item} x ${cart[item].qty} = ₹${t}</div>`;
}

summary.innerHTML += `<div class="total">Total: ₹${total}</div>`;

// PAYMENT DONE
function paid(){
localStorage.removeItem("cart");
window.location.href = "successful.html";
}

</script>

</body>
</html>
