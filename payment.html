<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan & Pay</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#f5e6d3;
padding:20px;
border-radius:18px;
width:340px;
text-align:center;
color:#2b1b14;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

h2{
margin-bottom:5px;
}

/* SCANNER FRAME */
.scanner-frame{
position:relative;
width:280px;
height:280px;
margin:15px auto;
border:3px solid #2b1b14;
border-radius:15px;
overflow:hidden;
background:#000;
}

/* CAMERA AREA */
#reader{
width:100%;
height:100%;
}

/* GREEN SCAN LINE ANIMATION */
.scanner-frame::before{
content:"";
position:absolute;
width:100%;
height:4px;
background:#2ecc71;
animation:scan 2s linear infinite;
z-index:2;
}

@keyframes scan{
0%{top:0;}
100%{top:100%;}
}

/* CORNER EFFECTS */
.corner{
position:absolute;
width:30px;
height:30px;
border:3px solid #2ecc71;
}

.tl{top:0;left:0;border-right:none;border-bottom:none;}
.tr{top:0;right:0;border-left:none;border-bottom:none;}
.bl{bottom:0;left:0;border-right:none;border-top:none;}
.br{bottom:0;right:0;border-left:none;border-top:none;}

p{
font-size:14px;
margin:5px 0;
}

</style>
</head>

<body>

<div class="box">

<h2>Scan & Pay ☕</h2>
<p>Align QR inside box</p>

<div class="scanner-frame">

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div id="reader"></div>

</div>

</div>

<script>

function onScanSuccess(decodedText) {

// success animation
document.body.style.background = "#1b5e20";

setTimeout(()=>{
window.location.href = "successful.html";
}, 1000);

}

let scanner = new Html5Qrcode("reader");

scanner.start(
{ facingMode: "environment" },
{ fps: 10, qrbox: 220 },
onScanSuccess
);

</script>

</body>
</html>
