<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#f5e6d3;
padding:20px;
border-radius:15px;
width:320px;
text-align:center;
}

#reader{
width:100%;
}

</style>
</head>

<body>

<div class="box">

<h2>Scan QR</h2>
<div id="reader"></div>

</div>

<script>

function onScanSuccess(decodedText, decodedResult){

html5QrcodeScanner.clear();

window.location.href = "successful.html";

}

let html5QrcodeScanner = new Html5QrcodeScanner(
"reader",
{ fps: 10, qrbox: 250 }
);

html5QrcodeScanner.render(onScanSuccess);

</script>

</body>
</html>
