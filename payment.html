<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan & Pay</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#f5e6d3;
padding:25px;
border-radius:18px;
width:330px;
text-align:center;
color:#2b1b14;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

h2{
margin-bottom:5px;
}

/* SCANNER BOX */
.scanner{
width:220px;
height:220px;
margin:15px auto;
border:3px solid #2b1b14;
border-radius:15px;
position:relative;
overflow:hidden;
background:#fff;
}

/* MOVING SCAN LINE */
.scanner::before{
content:"";
position:absolute;
width:100%;
height:4px;
background:#00ff66;
animation:scan 1.6s linear infinite;
}

@keyframes scan{
0%{top:0;}
100%{top:100%;}
}

/* CORNERS */
.corner{
position:absolute;
width:25px;
height:25px;
border:3px solid #00ff66;
}

.tl{top:0;left:0;border-right:none;border-bottom:none;}
.tr{top:0;right:0;border-left:none;border-bottom:none;}
.bl{bottom:0;left:0;border-right:none;border-top:none;}
.br{bottom:0;right:0;border-left:none;border-top:none;}

/* TEXT */
.status{
margin-top:10px;
font-size:14px;
color:#333;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.pay{
background:green;
color:white;
}

.pay:hover{
background:darkgreen;
}

</style>
</head>

<body>

<div class="box">

<h2>🔍 Scan & Pay</h2>
<p class="status" id="status">Scanning payment...</p>

<div class="scanner">

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

</div>

<button class="pay" onclick="done()">I Have Paid</button>

</div>

<script>

// ANIMATED TEXT
let i = 0;
setInterval(()=>{
let text = ["Scanning payment...", "Verifying...", "Connecting bank...", "Ready to pay"];
document.getElementById("status").innerText = text[i];
i = (i + 1) % text.length;
}, 1000);

// SUCCESS
function done(){
localStorage.removeItem("cart");
window.location.href = "successful.html";
}

</script>

</body>
</html>
