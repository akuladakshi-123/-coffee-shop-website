<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing Order</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

/* BIG SCREEN */
.screen{
width:650px;
height:380px;
background:#1f120d;
border-radius:18px;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:30px;
}

/* TITLE */
.title{
font-size:26px;
font-weight:600;
color:#ffcc70;
}

/* SUB TEXT */
.sub{
margin-top:10px;
font-size:14px;
opacity:0.7;
}

/* QR */
.qr{
width:170px;
height:170px;
margin-top:25px;
background:white;
padding:10px;
border-radius:10px;
}

.qr img{
width:100%;
height:100%;
}

/* STATUS */
.status{
margin-top:20px;
font-size:13px;
opacity:0.6;
letter-spacing:1px;
}

</style>
</head>

<body>

<div class="screen">

<div class="title">☕ Drip Cafe Payment</div>

<div class="sub">Please scan & complete payment</div>

<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=DripCafePayment" />
</div>

<div class="status">Processing order...</div>

</div>

<script>

// SIMPLE KFC STYLE WAIT (NO ANIMATION)
setTimeout(()=>{
localStorage.removeItem("cart");
window.location.href = "successful.html";
}, 4500);

</script>

</body>
</html>
