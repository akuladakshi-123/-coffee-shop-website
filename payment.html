<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#f5e6d3;
padding:30px;
border-radius:15px;
text-align:center;
width:320px;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
color:#2b1b14;
}

h2{
margin-bottom:10px;
}

img{
width:220px;
margin:15px 0;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:green;
color:white;
cursor:pointer;
font-size:15px;
}

button:hover{
background:darkgreen;
}

.summary{
text-align:left;
margin-top:10px;
font-size:14px;
}

</style>
</head>

<body>

<div class="box">

<h2>Scan & Pay ☕</h2>

<div class="summary" id="summary"></div>

<!-- QR CODE -->
<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi://pay?pa=YOURUPIID@upi&pn=DripCafe&cu=INR" />

<button onclick="paid()">I Have Paid</button>

</div>

<script>

// SHOW CART SUMMARY
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let summary = document.getElementById("summary");

let total = 0;

for(let item in cart){
let t = cart[item].price * cart[item].qty;
total += t;

summary.innerHTML += `<p>${item} x ${cart[item].qty} = ₹${t}</p>`;
}

summary.innerHTML += `<hr><b>Total: ₹${total}</b>`;

// AFTER PAYMENT
function paid(){
localStorage.removeItem("cart");
window.location.href = "successful.html";
}

</script>

</body>
</html>
