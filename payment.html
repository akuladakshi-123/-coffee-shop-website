<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Bill</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#f5e6d3;
padding:30px;
border-radius:18px;
width:320px;
text-align:center;
color:#2b1b14;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* SCANNER LOOK (NOT IMAGE STYLE) */
.scanner{
width:220px;
height:220px;
margin:15px auto;
border:3px solid #2b1b14;
border-radius:12px;
position:relative;
overflow:hidden;
background:#fff;
}

/* moving scan line */
.scanner::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:4px;
background:#2ecc71;
animation:scan 2s linear infinite;
}

@keyframes scan{
0%{top:0;}
100%{top:100%;}
}

p{
margin:5px 0;
font-size:14px;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:green;
color:white;
font-size:15px;
cursor:pointer;
}

button:hover{
background:darkgreen;
}

.total{
font-weight:bold;
margin-top:10px;
}

</style>
</head>

<body>

<div class="box">

<h2>Scan & Pay ☕</h2>

<p>Use any UPI app</p>

<div class="scanner"></div>

<div id="bill"></div>

<button onclick="paid()">I Have Paid</button>

</div>

<script>

// CART BILL
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let bill = document.getElementById("bill");

let total = 0;

for(let item in cart){
let t = cart[item].price * cart[item].qty;
total += t;

bill.innerHTML += `<p>${item} x ${cart[item].qty} = ₹${t}</p>`;
}

bill.innerHTML += `<div class="total">Total: ₹${total}</div>`;

// PAYMENT DONE
function paid(){
localStorage.removeItem("cart");
window.location.href = "successful.html";
}

</script>

</body>
</html>
