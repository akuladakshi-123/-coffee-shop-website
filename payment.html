<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:#f5e6d3;
width:360px;
padding:25px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

h2{
color:#2b1b14;
margin-bottom:8px;
}

.subtitle{
color:#6b4d3d;
margin-bottom:15px;
}

/* QR BOX */

.scanner-box{
position:relative;
width:220px;
height:220px;
margin:20px auto;
background:white;
border-radius:20px;
overflow:hidden;
border:2px solid #d7c2ab;
display:flex;
justify-content:center;
align-items:center;
}

.scan-line{
position:absolute;
left:0;
width:100%;
height:4px;
background:#00ff88;
box-shadow:0 0 15px #00ff88;
animation:scan 2s linear infinite;
}

@keyframes scan{
0%{top:0;}
100%{top:100%;}
}

.status{
margin-top:15px;
font-size:14px;
font-weight:500;
color:#2b1b14;
}

.dot{
display:inline-block;
width:10px;
height:10px;
background:#00c853;
border-radius:50%;
margin-right:8px;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:.3;}
}

.summary{
margin-top:20px;
padding:15px;
background:white;
border-radius:12px;
text-align:left;
color:#2b1b14;
}

.total{
font-weight:bold;
margin-top:10px;
font-size:17px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
background:#2b1b14;
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
background:#2b1b14;
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:all 0.3s ease;
}

button:hover{
background:#1a100b;
transform:translateY(-3px);
box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.orderid{
background:#fff;
padding:8px;
border-radius:10px;
margin-top:10px;
font-weight:600;
}

</style>
</head>
<body>

<div class="card">

<h2>☕ Drip Cafe</h2>
<p class="subtitle">Scan & Pay</p>

<div class="orderid">
Order #DC1024
</div>

<div class="scanner-box">

<img
src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=DripCafePayment"
alt="QR Code">

<div class="scan-line"></div>

</div>

<p style="margin-top:10px;color:#6b4d3d;font-size:14px;">
Please complete payment before clicking "I've Paid"
</p>

<div class="status">
<span class="dot"></span>
Scan using PhonePe, GPay or Paytm
</div>



<div class="summary" id="summary">
Loading order...
</div>

<button onclick="payNow()">
✅ I've Paid
</button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};

let summary = document.getElementById("summary");

let total = 0;
let html = "<h3>Order Summary</h3>";

for(let item in cart){

if(cart[item].qty > 0){

let itemTotal = cart[item].price * cart[item].qty;

total += itemTotal;

html += `
<p>${item} x ${cart[item].qty} = ₹${itemTotal}</p>
`;

}

}

html += `<p class="total">Total: ₹${total}</p>`;

summary.innerHTML = html;

function payNow(){

window.location.href = "successful.html";

}

</script>

</body>
</html>
