<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay - Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#1f120d;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
text-align:center;
background:#2b1b14;
padding:25px;
border-radius:20px;
width:320px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h2{
color:#ffcc70;
}

/* QR IMAGE */
.qr{
width:180px;
height:180px;
margin:15px auto;
background:white;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.qr img{
width:100%;
height:100%;
object-fit:cover;
}

/* SCAN ANIMATION */
.scan-line{
width:100%;
height:4px;
background:#ffcc70;
position:absolute;
top:0;
left:0;
animation:scan 2s infinite;
}

@keyframes scan{
0%{top:0;}
50%{top:180px;}
100%{top:0;}
}

.qr-wrapper{
position:relative;
width:180px;
height:180px;
margin:auto;
}

/* BUTTON */
.btn{
margin-top:15px;
padding:10px;
border:none;
border-radius:10px;
background:#2e7d32;
color:white;
cursor:pointer;
font-weight:600;
}

.small{
font-size:12px;
opacity:0.7;
margin-top:10px;
}

</style>
</head>

<body>

<div class="box">

<h2>Scan & Pay ☕</h2>

<div class="qr-wrapper">
<div class="qr">
<!-- Replace with your QR image -->
<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=DripCafePayment" />
</div>
<div class="scan-line"></div>
</div>

<p class="small">Scan using Google Pay / PhonePe / Paytm</p>

<button class="btn" onclick="done()">I Have Paid</button>

</div>

<script>

// clear cart on payment success
function done(){
localStorage.removeItem("cart");
window.location.href = "successful.html";
}

</script>

</body>
</html>
