<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan & Pay</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#f5e6d3;
padding:25px;
border-radius:18px;
width:320px;
text-align:center;
color:#2b1b14;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* FAKE SCANNER BOX */
.scanner{
width:220px;
height:220px;
margin:15px auto;
border:3px solid #2b1b14;
border-radius:15px;
position:relative;
overflow:hidden;
background:white;
}

/* moving scan line */
.scanner::before{
content:"";
position:absolute;
width:100%;
height:4px;
background:#00ff66;
animation:scan 1.5s linear infinite;
}

@keyframes scan{
0%{top:0;}
100%{top:100%;}
}

/* blinking dots */
.dots{
margin-top:10px;
font-size:14px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.pay{
background:green;
color:white;
}

.pay:hover{
background:darkgreen;
}

</style>
</head>

<body>

<div class="box">

<h2>🔍 Scanning Payment</h2>
<p>Do not close app</p>

<div class="scanner"></div>

<div class="dots" id="dots">Processing</div>

<button class="pay" onclick="done()">I Have Paid</button>

</div>

<script>

// DOT ANIMATION
let dot = 0;
setInterval(()=>{
let d = ["Processing", "Processing.", "Processing..", "Processing..."];
document.getElementById("dots").innerText = d[dot];
dot = (dot + 1) % d.length;
}, 500);

// AFTER PAYMENT
function done(){
localStorage.removeItem("cart");
window.location.href = "successful.html";
}

</script>

</body>
</html>
