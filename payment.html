<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.payment-card{
background:#f5e6d3;
width:350px;
padding:25px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

h2{
color:#2b1b14;
margin-bottom:10px;
}

.subtitle{
color:#6b4d3d;
margin-bottom:20px;
}

/* Scanner */

.scanner-box{
position:relative;
width:230px;
height:230px;
margin:20px auto;
background:white;
border-radius:20px;
overflow:hidden;
border:2px solid #d7c2ab;
}

.scan-line{
position:absolute;
left:0;
width:100%;
height:5px;
background:linear-gradient(90deg,#00ff88,#00c853,#00ff88);
box-shadow:0 0 15px #00ff88;
animation:scanMove 2s linear infinite;
}

@keyframes scanMove{
0%{top:0;}
100%{top:100%;}
}

.corner{
position:absolute;
width:35px;
height:35px;
border:4px solid #00c853;
}

.tl{
top:10px;
left:10px;
border-right:none;
border-bottom:none;
}

.tr{
top:10px;
right:10px;
border-left:none;
border-bottom:none;
}

.bl{
bottom:10px;
left:10px;
border-right:none;
border-top:none;
}

.br{
bottom:10px;
right:10px;
border-left:none;
border-top:none;
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

.icon{
width:70px;
height:70px;
background:#2b1b14;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:white;
position:relative;
z-index:2;
}

.ring{
position:absolute;
width:90px;
height:90px;
border:3px solid #00c853;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
animation:pulse 2s infinite;
}

.ring2{
animation-delay:1s;
}

@keyframes pulse{
0%{
transform:translate(-50%,-50%) scale(.5);
opacity:1;
}
100%{
transform:translate(-50%,-50%) scale(2);
opacity:0;
}
}

.status{
margin-top:15px;
font-size:14px;
font-weight:500;
color:#2b1b14;
}

.dot{
display:inline-block;
width:10px;
height:10px;
background:#00c853;
border-radius:50%;
margin-right:8px;
animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:.3;
}
}

.summary{
margin-top:20px;
padding:15px;
background:white;
border-radius:12px;
text-align:left;
color:#2b1b14;
}

.total{
font-weight:bold;
margin-top:10px;
}

button{
width:100%;
margin-top:20px;
padding:14px;
border:none;
border-radius:12px;
background:#2b1b14;
color:white;
font-size:15px;
cursor:pointer;
font-weight:600;
}

button:hover{
background:#1a100b;
}

</style>
</head>
<body>

<div class="payment-card">

<h2>💳 Scan & Pay</h2>
<p class="subtitle">Secure Payment Gateway</p>

<div class="scanner-box">

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="scan-line"></div>

<div class="center">

<div class="ring"></div>
<div class="ring ring2"></div>

<div style="
font-size:60px;
letter-spacing:-5px;
font-family:monospace;
">
▓▓▓<br>
▓░▓<br>
▓▓▓
</div>

</div>

</div>

<div class="status">
<span class="dot"></span>
Waiting for payment confirmation...
</div>

<div class="summary" id="summary">
Loading order...
</div>

<button onclick="payNow()">
✅ Payment Completed
</button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};

let summary = document.getElementById("summary");

let total = 0;
let html = "<h3>Order Summary</h3>";

for(let item in cart){

if(cart[item].qty > 0){

let itemTotal = cart[item].price * cart[item].qty;

total += itemTotal;

html += `
<p>${item} x ${cart[item].qty} = ₹${itemTotal}</p>
`;

}
}

html += `<p class="total">Total: ₹${total}</p>`;

summary.innerHTML = html;

function payNow(){

window.location.href = "successful.html";

}

</script>

</body>
</html>
