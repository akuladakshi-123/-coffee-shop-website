<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Counter</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#0b0f14;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* MAIN SCREEN (LIKE KFC COUNTER DISPLAY) */
.screen{
width:420px;
background:#111827;
border-radius:14px;
padding:25px;
box-shadow:0 20px 50px rgba(0,0,0,0.5);
}

/* HEADER BAR */
.top{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.1);
padding-bottom:10px;
margin-bottom:15px;
}

.brand{
font-size:14px;
font-weight:600;
color:#ffcc70;
}

.status{
font-size:12px;
opacity:0.8;
}

/* QR SECTION */
.qr-area{
display:flex;
gap:20px;
align-items:center;
background:#0f172a;
padding:15px;
border-radius:12px;
}

/* BIG QR */
.qr{
width:160px;
height:160px;
background:white;
padding:10px;
border-radius:10px;
}

.qr img{
width:100%;
height:100%;
}

/* TEXT SIDE */
.info h2{
margin:0;
font-size:16px;
}

.info p{
margin:6px 0;
font-size:12px;
opacity:0.7;
}

/* AMOUNT BOX */
.amount{
margin-top:15px;
background:#0f172a;
padding:12px;
border-radius:10px;
display:flex;
justify-content:space-between;
font-weight:600;
}

/* FOOTER NOTE */
.note{
margin-top:15px;
font-size:11px;
opacity:0.6;
text-align:center;
}

</style>
</head>

<body>

<div class="screen">

<div class="top">
<div class="brand">☕ Drip Cafe Counter</div>
<div class="status">WAITING FOR SCAN</div>
</div>

<div class="qr-area">

<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=DripCafePayment" />
</div>

<div class="info">
<h2>Scan & Pay</h2>
<p>Use UPI / PhonePe / GPay</p>
<p>Pay to complete order</p>
</div>

</div>

<div class="amount">
<span>Total Amount</span>
<span id="total">₹0</span>
</div>

<div class="note">
This is a secure payment counter display
</div>

</div>

<script>

// LOAD CART TOTAL
let cart = JSON.parse(localStorage.getItem("cart")) || {};

let total = 0;
for(let i in cart){
total += cart[i].price * cart[i].qty;
}

document.getElementById("total").innerText = "₹" + total;

// AUTO SUCCESS AFTER SCAN TIME (LIKE REAL COUNTER)
setTimeout(()=>{
localStorage.removeItem("cart");
window.location.href = "successful.html";
}, 4000);

</script>

</body>
</html>
