<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart</title>

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:white;
}

h1{
text-align:center;
padding:20px;
}

.box{
max-width:600px;
margin:auto;
background:#f5e6d3;
color:#2b1b14;
padding:20px;
border-radius:15px;
}

.item{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #ddd;
}

.total{
text-align:right;
font-size:20px;
font-weight:bold;
margin-top:15px;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.view{
background:#2b1b14;
color:white;
}

.order{
background:green;
color:white;
}

.clear{
background:red;
color:white;
}

</style>
</head>

<body>

<h1>🛒 Your Cart</h1>

<div class="box" id="box"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};
let box = document.getElementById("box");

let total = 0;
let hasItems = false;

for(let item in cart){

if(cart[item].qty > 0){

hasItems = true;

let itemTotal = cart[item].price * cart[item].qty;
total += itemTotal;

box.innerHTML += `
<div class="item">
<span>${item} x ${cart[item].qty}</span>
<span>₹${itemTotal}</span>
</div>
`;
}
}

if(!hasItems){
box.innerHTML = "<h3 style='text-align:center'>Cart is empty ☕</h3>";
}
else{

box.innerHTML += `
<div class="total">Total: ₹${total}</div>

<div class="buttons">
<button class="view" onclick="goMenu()">Add More</button>
<button class="order" onclick="orderNow()">Order Now</button>
<button class="clear" onclick="clearCart()">Clear</button>
</div>
`;
}

function goMenu(){
window.location.href = "menu.html";
}

function orderNow(){
localStorage.setItem("cart", JSON.stringify(cart));
window.location.href = "order.html";
}

function clearCart(){
localStorage.removeItem("cart");
location.reload();
}

</script>

</body>
</html>
