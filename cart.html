<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body{font-family:Poppins;background:#f5efe6;margin:0;}
        header{background:#3b2f2f;color:white;padding:20px;text-align:center;}

        .card{
            background:white;
            margin:10px auto;
            padding:15px;
            max-width:450px;
            border-radius:12px;
            display:flex;
            justify-content:space-between;
        }

        .total{text-align:center;font-size:22px;margin:20px;}
        button{background:#3b2f2f;color:white;border:none;padding:10px;border-radius:10px;}
    </style>
</head>

<body>

<header><h1>🛒 Your Cart</h1></header>

<div id="cartItems"></div>

<div class="total" id="total">Total: ₹0</div>

<div style="text-align:center">
    <a href="checkout.html"><button>Proceed to Pay ☕</button></a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let container = document.getElementById("cartItems");
let total = 0;

container.innerHTML = "";

for(let name in cart){
    let item = cart[name];

    if(item.qty>0){
        let itemTotal = item.qty * item.price;
        total += itemTotal;

        container.innerHTML += `
            <div class="card">
                <div>
                    <h3>${name}</h3>
                    <p>₹${item.price} × ${item.qty}</p>
                </div>
                <div>₹${itemTotal}</div>
            </div>
        `;
    }
}

document.getElementById("total").innerText = "Total: ₹"+total;
</script>

</body>
</html>
