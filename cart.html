<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:white;
padding:20px;
}

h1{
text-align:center;
}

.box{
max-width:700px;
margin:auto;
background:#f5e6d3;
color:#2b1b14;
padding:20px;
border-radius:20px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
border-bottom:1px solid #ddd;
}

.controls button{
margin:0 5px;
padding:5px 10px;
border:none;
border-radius:6px;
cursor:pointer;
}

.add{ background:#2b1b14; color:white; }
.remove{ background:#c62828; color:white; }

.total{
text-align:right;
font-size:22px;
font-weight:bold;
margin-top:15px;
}

.actions{
display:flex;
gap:10px;
margin-top:20px;
}

.btn{
flex:1;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.menuBtn{ background:#2b1b14; color:white; }
.payBtn{ background:#2e7d32; color:white; }
.clearBtn{ background:#c62828; color:white; }

.empty{
text-align:center;
padding:20px;
}
</style>
</head>

<body>

<h1>☕ Your Cart</h1>

<div class="box" id="box"></div>

<script>

// 🧠 CART LOAD
let cart = JSON.parse(localStorage.getItem("cart")) || {};

// 💾 SAVE
function save(){
localStorage.setItem("cart", JSON.stringify(cart));
}

// 📊 RENDER CART
function render(){
let box = document.getElementById("box");
box.innerHTML = "";

let total = 0;
let hasItems = false;

Object.keys(cart).forEach(item => {

if(cart[item].qty > 0){
hasItems = true;

let itemTotal = cart[item].price * cart[item].qty;
total += itemTotal;

box.innerHTML += `
<div class="item">
  <div>
    <b>${item}</b><br>
    ₹${cart[item].price}
  </div>

  <div class="controls">
    <button class="add" onclick="inc('${item}')">+</button>
    <span>${cart[item].qty}</span>
    <button class="add" onclick="dec('${item}')">-</button>
    <button class="remove" onclick="removeItem('${item}')">x</button>
  </div>
</div>
`;
}
});

if(!hasItems){
box.innerHTML = `<div class="empty">☕ Cart is empty</div>`;
}

box.innerHTML += `
<div class="total">Total: ₹${total}</div>

<div class="actions">
<button class="btn menuBtn" onclick="goMenu()">Add More</button>
<button class="btn payBtn" onclick="checkout()">Proceed</button>
<button class="btn clearBtn" onclick="clearCart()">Clear</button>
</div>
`;
}

// ➕ INCREASE
function inc(item){
cart[item].qty++;
save();
render();
}

// ➖ DECREASE
function dec(item){
if(cart[item].qty > 1){
cart[item].qty--;
} else {
delete cart[item];
}
save();
render();
}

// ❌ REMOVE
function removeItem(item){
delete cart[item];
save();
render();
}

// 🧹 CLEAR CART
function clearCart(){
cart = {};
save();
render();
}

// 🏠 MENU PAGE
function goMenu(){
window.location.href = "menu.html";
}

// 💳 NEXT STEP
function checkout(){
window.location.href = "order.html";
}

render();

</script>

</body>
</html>
