<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* 📱 MOBILE APP STYLE BACKGROUND */
body{
margin:0;
font-family:Poppins;
background:#1f120d;
color:white;
padding:15px;
}

h1{
text-align:center;
font-size:20px;
margin-bottom:15px;
}

/* 🧾 CART CONTAINER */
.box{
max-width:600px;
margin:auto;
background:#2b1b14;
padding:15px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* ITEM CARD */
.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
border-bottom:1px solid rgba(255,255,255,0.1);
}

/* CONTROLS */
.controls{
display:flex;
align-items:center;
gap:8px;
}

/* BUTTONS */
button{
border:none;
cursor:pointer;
border-radius:8px;
padding:6px 10px;
font-weight:600;
}

.plus, .minus{
background:#ffcc70;
color:#2b1b14;
}

.remove{
background:#c62828;
color:white;
}

/* TOTAL */
.total{
text-align:right;
font-size:20px;
font-weight:700;
margin-top:15px;
}

/* ACTIONS */
.actions{
display:flex;
gap:10px;
margin-top:20px;
}

/* ACTION BUTTONS */
.btn{
flex:1;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

.menuBtn{ background:#ffcc70; color:#2b1b14; }
.payBtn{ background:#2e7d32; color:white; }
.clearBtn{ background:#c62828; color:white; }

/* EMPTY STATE */
.empty{
text-align:center;
padding:20px;
opacity:0.8;
}

/* SMALL ANIMATION */
.item{
transition:0.2s;
}
.item:hover{
transform:scale(1.01);
}
</style>
</head>

<body>

<h1>🛒 Your Cart</h1>

<div class="box" id="box"></div>

<script>

// 🧠 LOAD CART
let cart = JSON.parse(localStorage.getItem("cart")) || {};

// 💾 SAVE CART
function save(){
localStorage.setItem("cart", JSON.stringify(cart));
}

// 📊 RENDER CART
function render(){
let box = document.getElementById("box");
box.innerHTML = "";

let total = 0;
let hasItems = false;

Object.keys(cart).forEach(item => {

let data = cart[item];
if(!data || data.qty <= 0) return;

hasItems = true;

let itemTotal = data.price * data.qty;
total += itemTotal;

box.innerHTML += `
<div class="item">
  <div>
    <b>${item}</b><br>
    ₹${data.price}
  </div>

  <div class="controls">
    <button class="minus" onclick="dec('${item}')">-</button>
    <span>${data.qty}</span>
    <button class="plus" onclick="inc('${item}')">+</button>
    <button class="remove" onclick="removeItem('${item}')">x</button>
  </div>
</div>
`;
});

if(!hasItems){
box.innerHTML = `<div class="empty">☕ Your cart is empty</div>`;
return;
}

box.innerHTML += `
<div class="total">Total: ₹${total}</div>

<div class="actions">
<button class="btn menuBtn" onclick="goMenu()">Add More</button>
<button class="btn payBtn" onclick="checkout()">Proceed to Payment</button>
<button class="btn clearBtn" onclick="clearCart()">Clear</button>
</div>
`;
}

// ➕ INCREASE
function inc(item){
if(cart[item]){
cart[item].qty++;
save();
render();
}
}

// ➖ DECREASE
function dec(item){
if(cart[item]){
cart[item].qty--;
if(cart[item].qty <= 0){
delete cart[item];
}
save();
render();
}
}

// ❌ REMOVE
function removeItem(item){
delete cart[item];
save();
render();
}

// 🧹 CLEAR CART
function clearCart(){
cart = {};
save();
render();
}

// 🏠 MENU
function goMenu(){
window.location.href = "menu.html";
}

// 💳 PAYMENT FLOW
function checkout(){
window.location.href = "order.html";
}

render();

</script>

</body>
</html>
