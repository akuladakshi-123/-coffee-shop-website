<!DOCTYPE html>
<html>
<head>
    <title>Your Cart - Drip Cafe</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5efe6;
            margin: 0;
        }

        header {
            background: #3b2f2f;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 10px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qty {
            font-weight: bold;
        }

        .total {
            text-align: center;
            font-size: 20px;
            margin-top: 20px;
        }

        button {
            background: #3b2f2f;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #6f4e37;
        }

        .checkout {
            text-align: center;
            margin: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Your Cart</h1>
</header>

<div class="container" id="cartItems"></div>

<div class="total" id="total">Total: ₹0</div>

<div class="checkout">
    <a href="checkout.html">
        <button>Proceed to Pay ☕</button>
    </a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let container = document.getElementById("cartItems");
let total = 0;

for (let item in cart) {
    let data = cart[item];

    if (data.qty > 0) {
        total += data.price * data.qty;

        container.innerHTML += `
            <div class="card">
                <div>
                    <h3>${item}</h3>
                    <p>₹${data.price}</p>
                </div>

                <div class="qty">
                    x ${data.qty}
                </div>
            </div>
        `;
    }
}

document.getElementById("total").innerText = "Total: ₹" + total;
</script>

</body>
</html>
