<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe Order Summary</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
min-height:100vh;
padding:30px;
color:white;
}

h1{
text-align:center;
margin-bottom:30px;
font-size:40px;
font-weight:700;
}

.box{
max-width:850px;
margin:auto;
background:#f5e6d3;
color:#2b1b14;
padding:35px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

.item{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid #ddd;
font-size:18px;
}

.total{
text-align:right;
font-size:28px;
font-weight:bold;
margin-top:25px;
padding-top:15px;
border-top:2px solid #ddd;
}

.buttons{
display:flex;
gap:15px;
margin-top:25px;
flex-wrap:wrap;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
font-weight:600;
transition:0.3s;
}

button:hover{
transform:translateY(-4px);
box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.add{
background:#2b1b14;
color:white;
}

.order{
background:#2e7d32;
color:white;
}

.clear{
background:#c62828;
color:white;
}

.empty{
text-align:center;
font-size:22px;
padding:30px;
}

</style>
</head>

<body>

<h1>☕ Drip Cafe Order Summary</h1>

<div class="box" id="box"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};
let box = document.getElementById("box");

let total = 0;
let hasItems = false;

for(let item in cart){

if(cart[item].qty > 0){

hasItems = true;

let itemTotal = cart[item].price * cart[item].qty;

total += itemTotal;

box.innerHTML += `
<div class="item">
<span>${item} × ${cart[item].qty}</span>
<span>₹${itemTotal}</span>
</div>
`;

}
}

if(!hasItems){

box.innerHTML = `
<div class="empty">
☕ Your cart is empty
<br><br>
<button class="add" onclick="goMenu()">Browse Menu</button>
</div>
`;

}else{

box.innerHTML += `
<div class="total">
Total: ₹${total}
</div>

<div class="buttons">
<button class="add" onclick="goMenu()">☕ Add More</button>
<button class="order" onclick="orderNow()">💳 Proceed to Payment</button>
<button class="clear" onclick="clearCart()">🗑 Clear Cart</button>
</div>
`;
}

function goMenu(){
window.location.href="menu.html";
}

function orderNow(){
localStorage.setItem("cart", JSON.stringify(cart));
window.location.href="order.html";
}

function clearCart(){

if(confirm("Clear all items from cart?")){
localStorage.removeItem("cart");
location.reload();
}

}

</script>

</body>
</html>
