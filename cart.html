<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Drip Cafe</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family:Poppins;
            background:#f7f1e8;
            text-align:center;
        }

        header{
            background:#3b2f2f;
            color:white;
            padding:20px;
        }

        .card{
            background:white;
            max-width:400px;
            margin:15px auto;
            padding:15px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
        }

        h3{
            margin:5px 0;
        }

        .total{
            font-size:22px;
            font-weight:bold;
            margin:20px;
        }

        button{
            background:#3b2f2f;
            color:white;
            border:none;
            padding:10px 14px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:#6f4e37;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Your Cart</h1>
</header>

<div id="cartItems"></div>

<div class="total" id="total">Total: ₹0</div>

<a href="checkout.html">
    <button>Proceed to Checkout ☕</button>
</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let container = document.getElementById("cartItems");
let total = 0;

container.innerHTML = "";

for(let name in cart){
    let item = cart[name];

    if(item.qty > 0){
        let itemTotal = item.price * item.qty;
        total += itemTotal;

        container.innerHTML += `
            <div class="card">
                <h3>${name}</h3>
                <p>₹${item.price} × ${item.qty} = ₹${itemTotal}</p>
            </div>
        `;
    }
}

document.getElementById("total").innerText = "Total: ₹" + total;
</script>

</body>
</html>
