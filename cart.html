<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart</title>

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:white;
}

h1{
text-align:center;
padding:20px;
}

.box{
max-width:600px;
margin:auto;
background:#f5e6d3;
color:#2b1b14;
padding:20px;
border-radius:12px;
}

.item{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #ccc;
}

.total{
text-align:right;
font-size:20px;
font-weight:bold;
margin-top:10px;
}

button{
padding:10px 15px;
border:none;
background:#2b1b14;
color:white;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}

</style>
</head>

<body>

<h1>🛒 Your Cart</h1>

<div class="box" id="box"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || {};

let box = document.getElementById("box");

let total = 0;

for(let item in cart){

if(cart[item].qty > 0){

let itemTotal = cart[item].price * cart[item].qty;
total += itemTotal;

box.innerHTML += `
<div class="item">
<span>${item} x ${cart[item].qty}</span>
<span>₹${itemTotal}</span>
</div>
`;
}
}

box.innerHTML += `
<div class="total">Total: ₹${total}</div>
<button onclick="clearCart()">Clear Cart</button>
`;

function clearCart(){
localStorage.removeItem("cart");
location.reload();
}

</script>

</body>
</html>
