<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Successful | Drip Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
padding:20px;
}
.box{
background:#f5e6d3;
color:#2b1b14;
padding:45px;
border-radius:30px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.35);
max-width:420px;
width:100%;
animation:pop 0.6s ease;
}
@keyframes pop{
0%{
transform:scale(0.7);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}
.check{
width:110px;
height:110px;
background:#2ecc71;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
margin:auto;
animation:zoom 0.8s ease;
box-shadow:0 0 30px rgba(46,204,113,0.5);
}
.check span{
font-size:60px;
color:white;
font-weight:bold;
}
@keyframes zoom{
0%{
transform:scale(0);
}
100%{
transform:scale(1);
}
}
h1{
margin-top:20px;
font-family:'Playfair Display',serif;
font-size:42px;
}
p{
margin-top:12px;
color:#444;
font-size:15px;
}
.orderid{
margin-top:18px;
padding:12px;
background:white;
border-radius:12px;
font-weight:600;
}
.time{
margin-top:15px;
font-size:14px;
color:#666;
}
button{
margin-top:30px;
padding:16px 35px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:all 0.3s ease;
box-shadow:0 8px 20px rgba(0,0,0,0.25);
}
button:hover{
transform:translateY(-4px) scale(1.03);
box-shadow:0 12px 25px rgba(0,0,0,0.35);
}
button:active{
transform:scale(0.97);
}
.footer{
margin-top:20px;
font-size:13px;
color:#777;
}
</style>
</head>
<body>
<div class="box">
<div class="check">
<span>✓</span>
</div>
<h1>Thank You!</h1>
<p>Payment Successful ☕</p>
<p>Your order has been placed successfully.</p>
<div class="orderid">
Order ID: #DC1024
</div>
<div class="time">
⏱ Estimated preparation time: 8-10 mins
</div>
<button onclick="goHome()">
☕ Continue Exploring
</button>
<div class="footer">
We look forward to serving you again.
</div>
</div>
<script>
function goHome(){
document.body.style.opacity="0.6";
setTimeout(function(){
window.location.href="index.html";
},400);
}
</script>
</body>
</html>
