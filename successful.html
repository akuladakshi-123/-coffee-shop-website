<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Successful - Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

/* CARD */
.card{
text-align:center;
background:#f5e6d3;
color:#2b1b14;
padding:30px;
border-radius:20px;
width:320px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
animation:pop 0.6s ease;
}

@keyframes pop{
from{ transform:scale(0.6); opacity:0; }
to{ transform:scale(1); opacity:1; }
}

/* TICK */
.tick{
font-size:60px;
color:#2e7d32;
margin-bottom:10px;
}

/* BUTTON */
button{
margin-top:15px;
padding:12px;
border:none;
border-radius:10px;
background:#2b1b14;
color:white;
cursor:pointer;
font-weight:600;
}

/* FLOATING CONFETTI */
.confetti{
position:absolute;
width:10px;
height:10px;
background:gold;
top:-10px;
animation:fall 4s linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}
</style>
</head>

<body>

<div class="card">
<div class="tick">✔</div>
<h2>Order Successful!</h2>
<p>Your coffee is being prepared ☕🚀</p>
<button onclick="goHome()">Back to Home</button>
</div>

<script>

// 🧠 SIMPLE CONFETTI EFFECT
for(let i=0;i<25;i++){
let c = document.createElement("div");
c.className = "confetti";
c.style.left = Math.random()*100 + "vw";
c.style.background = ["#ffcc70","#fff","#2e7d32","#c62828"][Math.floor(Math.random()*4)];
c.style.animationDuration = (2+Math.random()*3)+"s";
document.body.appendChild(c);
}

// 🏠 HOME
function goHome(){
window.location.href = "index.html";
}

</script>

</body>
</html>
