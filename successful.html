<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Successful</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#0f0a08;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
text-align:center;
background:#1f120d;
padding:30px;
border-radius:20px;
width:320px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
animation:pop 0.6s ease;
}

/* POP ANIMATION */
@keyframes pop{
0%{transform:scale(0.5); opacity:0;}
100%{transform:scale(1); opacity:1;}
}

/* CHECK ICON */
.check{
width:80px;
height:80px;
background:#2e7d32;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:40px;
animation:bounce 0.8s ease;
}

@keyframes bounce{
0%{transform:scale(0);}
60%{transform:scale(1.2);}
100%{transform:scale(1);}
}

h2{
margin-top:15px;
color:#ffcc70;
}

p{
opacity:0.8;
font-size:14px;
}

/* BUTTON */
.btn{
margin-top:15px;
padding:10px;
border:none;
border-radius:10px;
background:#ffcc70;
color:#2b1b14;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

<div class="check">✔</div>

<h2>Order Placed!</h2>
<p>Your coffee is being prepared ☕🚀</p>

<button class="btn" onclick="home()">Back to Home</button>

</div>

<!-- 🔊 SOUND -->
<audio id="successSound">
<source src="https://www.soundjay.com/buttons/sounds/button-09.mp3" type="audio/mpeg">
</audio>

<script>

// play sound automatically
window.onload = function(){
document.getElementById("successSound").play();
};

function home(){
window.location.href = "index.html";
}

</script>

</body>
</html>
