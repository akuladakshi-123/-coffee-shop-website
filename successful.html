<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#0f0a08;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* CARD */
.container{
text-align:center;
background:#1f120d;
padding:28px;
border-radius:18px;
width:320px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
animation:pop 0.4s ease;
}

@keyframes pop{
from{transform:scale(0.95); opacity:0;}
to{transform:scale(1); opacity:1;}
}

/* CHECK ICON */
.icon{
width:70px;
height:70px;
margin:auto;
border-radius:50%;
border:2px solid #2e7d32;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:#2e7d32;
}

/* TEXT */
h2{
margin-top:15px;
font-size:20px;
font-weight:600;
}

p{
font-size:13px;
opacity:0.75;
margin-top:8px;
line-height:1.4;
}

/* ORDER ID */
.order-id{
margin-top:12px;
font-size:12px;
opacity:0.6;
letter-spacing:0.5px;
}

/* BUTTON */
.btn{
margin-top:18px;
padding:10px 14px;
border:none;
border-radius:10px;
background:#ffcc70;
color:#2b1b14;
font-weight:600;
cursor:pointer;
transition:0.2s;
}

.btn:hover{
transform:scale(1.03);
}

</style>
</head>

<body>

<div class="container">

<div class="icon">✓</div>

<h2>Order Confirmed</h2>

<p>
Your order has been placed successfully.<br>
We’re preparing your coffee ☕
</p>

<div class="order-id" id="orderId"></div>

<button class="btn" onclick="goHome()">Back to Home</button>

</div>

<script>

// 📦 ORDER ID GENERATOR
let id = "DC" + Math.floor(100000 + Math.random() * 900000);
document.getElementById("orderId").innerText = "Order ID: " + id;

// 🔊 SUBTLE SOUND (SAFE)
window.onload = () => {
let audio = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
audio.volume = 0.15;
audio.play().catch(()=>{});
};

// 🏠 HOME
function goHome(){
window.location.href = "index.html";
}

</script>

</body>
</html>
