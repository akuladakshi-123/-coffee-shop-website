<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Order Confirmed</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family:Poppins;
            background:#f7f1e8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            width:320px;
            padding:30px;
            border-radius:16px;
            box-shadow:0 10px 25px rgba(0,0,0,0.12);
            text-align:center;
            animation: fade 0.5s ease;
        }

        @keyframes fade{
            from{opacity:0; transform:scale(0.9);}
            to{opacity:1; transform:scale(1);}
        }

        h1{
            color:#3b2f2f;
            margin-bottom:10px;
        }

        .eta{
            font-size:16px;
            color:#6f4e37;
            margin:15px 0;
        }

        .time-box{
            background:#f7f1e8;
            padding:15px;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
            color:#3b2f2f;
        }

        button{
            margin-top:20px;
            width:100%;
            padding:10px;
            border:none;
            border-radius:10px;
            background:#3b2f2f;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#6f4e37;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>☕ Order Confirmed</h1>

    <div class="eta">Estimated Time</div>

    <div class="time-box">
        8 – 12 minutes
    </div>

    <button onclick="home()">Back to Home</button>

</div>

<script>
function home(){
    window.location.href = "index.html";
}
</script>

</body>
</html>
