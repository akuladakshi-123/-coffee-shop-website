<!DOCTYPE html>
<html>
<head>
    <title>Order Confirmed</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f7f1e8;
            text-align: center;
        }

        .box {
            margin-top: 120px;
        }

        .tick {
            font-size: 80px;
            animation: pop 0.6s ease;
        }

        h1 {
            color: #3b2f2f;
            margin: 10px 0;
        }

        p {
            color: #6f4e37;
            font-size: 16px;
        }

        .card {
            background: white;
            max-width: 350px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        @keyframes pop {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        button {
            background: #3b2f2f;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #6f4e37;
        }

        .small {
            font-size: 13px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="tick">☑️</div>

    <h1>Order Confirmed!</h1>
    <p>Your coffee is being prepared ☕</p>

    <div class="card">
        <p class="small">Estimated Time</p>
        <h2>10–15 mins</h2>
    </div>

    <button onclick="goHome()">Back to Home</button>

</div>

<script>
function goHome() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
