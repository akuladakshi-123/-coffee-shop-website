<!DOCTYPE html>
<html>
<head>
    <title>Order Confirmed</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family:Poppins;
            background:#f7f1e8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:16px;
            width:320px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
            animation: pop 0.5s ease;
        }

        @keyframes pop{
            from{ transform:scale(0.8); opacity:0; }
            to{ transform:scale(1); opacity:1; }
        }

        .tick{
            font-size:60px;
        }

        h1{
            margin:10px 0;
            color:#3b2f2f;
        }

        p{
            color:#6f4e37;
            font-size:14px;
        }

        .status{
            margin:20px 0;
            text-align:left;
        }

        .step{
            padding:10px;
            margin:8px 0;
            border-radius:10px;
            background:#f7f1e8;
            font-size:14px;
        }

        .done{
            border-left:5px solid green;
        }

        .active{
            border-left:5px solid #3b2f2f;
            font-weight:600;
        }

        button{
            background:#3b2f2f;
            color:white;
            border:none;
            padding:10px 14px;
            border-radius:10px;
            cursor:pointer;
            width:100%;
            margin-top:10px;
        }

        button:hover{
            background:#6f4e37;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="tick">☕</div>

    <h1>Order Confirmed</h1>
    <p>Your coffee journey has started</p>

    <div class="status">

        <div class="step done">✔ Order Placed</div>
        <div class="step done">✔ Payment Done</div>
        <div class="step active">⏳ Brewing Fresh Coffee</div>
        <div class="step">📦 Ready for Pickup</div>

    </div>

    <button onclick="home()">Back to Home</button>

</div>

<script>
function home(){
    window.location.href="index.html";
}
</script>

</body>
</html>
