<!DOCTYPE html>
<html>
<head>
    <title>Order Status</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family:Poppins;
            background:#f7f1e8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            width:320px;
            padding:25px;
            border-radius:16px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
            text-align:center;
            animation: fade 0.5s ease;
        }

        @keyframes fade{
            from{opacity:0; transform:scale(0.9);}
            to{opacity:1; transform:scale(1);}
        }

        h2{
            color:#3b2f2f;
            margin-bottom:5px;
        }

        .time{
            color:#6f4e37;
            font-size:14px;
            margin-bottom:20px;
        }

        .step{
            text-align:left;
            padding:10px;
            margin:8px 0;
            border-radius:10px;
            background:#f7f1e8;
            font-size:14px;
            position:relative;
        }

        .done{
            border-left:5px solid green;
        }

        .active{
            border-left:5px solid #3b2f2f;
            font-weight:600;
        }

        .eta{
            font-size:13px;
            color:#6f4e37;
            margin-top:15px;
        }

        button{
            margin-top:15px;
            width:100%;
            padding:10px;
            border:none;
            border-radius:10px;
            background:#3b2f2f;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#6f4e37;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>☕ Order Confirmed</h2>
    <div class="time">Estimated time: 8–12 mins</div>

    <div class="step done">✔ Order Placed</div>
    <div class="step done">✔ Payment Received</div>
    <div class="step active">⏳ Brewing Fresh Coffee</div>
    <div class="step">📦 Almost Ready for Pickup</div>

    <div class="eta">Your coffee will be ready soon ☕✨</div>

    <button onclick="home()">Back to Home</button>

</div>

<script>
function home(){
    window.location.href="index.html";
}
</script>

</body>
</html>
