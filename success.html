<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Successful</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#2b1b14,#5a3a2b);

align-items:center;
height:100vh;
color:#fff;
}

.box{
text-align:center;
background:#f5e6d3;
color:#2b1b14;

}

h1{

font-size:40px;

}

p{
margin:10px 0;
}

button{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:10px;
background:#2b1b14;
color:white;
cursor:pointer;
}

button:hover{
background:#1a0f0b;
}

</style>
</head>

<body>

<div class="box">
<h1>🎉 Order Successful!</h1>
<p>Thank you for ordering from Drip Cafe ☕</p>
<p>Your coffee is being prepared...</p>

<button onclick="goHome()">Back to Menu</button>

<script>
function goHome(){
window.location.href = "menu.html";
}
</script>

</html>
