<!DOCTYPE html>
<html>
<head>
    <title>Order Status</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family:Poppins;
            background:#f7f1e8;
            text-align:center;
        }

        .box{
            margin-top:80px;
        }

        h1{
            color:#3b2f2f;
        }

        .step{
            max-width:300px;
            margin:10px auto;
            background:white;
            padding:12px;
            border-radius:10px;
            box-shadow:0 5px 10px rgba(0,0,0,0.08);
        }

        .active{
            border-left:6px solid #3b2f2f;
        }

        .done{
            border-left:6px solid green;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>☕ Order Status</h1>

    <div class="step done">✔ Order Confirmed</div>
    <div class="step done">✔ Payment Received</div>
    <div class="step active">⏳ Coffee is Being Prepared</div>
    <div class="step">📦 Ready for Pickup</div>

    <br>

    <button onclick="goHome()">Back to Home</button>

</div>

<script>
function goHome(){
    window.location.href="index.html";
}
</script>

</body>
</html>
