<!DOCTYPE html>
<html>
<head>
    <title>Checkout - DAKSHI CAFE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>💳 Choose Payment Method</h1>

<button onclick="selectPayment('Cash')">💵 Cash on Delivery</button>
<button onclick="selectPayment('UPI')">📱 UPI Payment</button>

<br><br>

<p id="selected">No payment selected</p>

<br>

<button onclick="goNext()">Place Order</button>

<script>
let payment = "";

function selectPayment(type) {
    payment = type;
    document.getElementById("selected").innerText = "Selected: " + type;
}

function goNext() {
    if (payment === "") {
        alert("Please select payment method");
    } else {
        window.location.href = "order.html";
    }
}
</script>

</body>
</html>
