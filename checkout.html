<!DOCTYPE html>
<html>
<head>
    <title>Checkout - Drip Cafe</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f5efe6;
            text-align: center;
        }

        header {
            background: #3b2f2f;
            color: white;
            padding: 20px;
        }

        .box {
            max-width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .upi {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: 600;
        }

        button {
            background: #3b2f2f;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6f4e37;
        }

        .note {
            font-size: 13px;
            color: gray;
            margin-top: 10px;
        }

        img {
            width: 220px;
            height: 220px;
            margin: 20px auto;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>💳 Secure UPI Payment</h1>
</header>

<div class="box">

    <h2>Scan & Pay</h2>

    <!-- REAL QR CODE -->
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi://pay?pa=dripcafe@upi&pn=Drip%20Cafe" />

    <div class="upi">
        UPI ID: dripcafe@upi
    </div>

    <p>Pay using GPay / PhonePe / Paytm</p>

    <button onclick="placeOrder()">I Have Paid ✔ Place Order</button>

    <p class="note">
        After payment click the button to confirm order ☕
    </p>

</div>

<script>
function placeOrder() {
    localStorage.removeItem("cart");
    window.location.href = "success.html";
}
</script>

</body>
</html>
