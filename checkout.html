<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>Checkout - Drip Cafe</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f7f1e8;
            text-align: center;
        }

        header {
            background: #3b2f2f;
            color: white;
            padding: 20px;
        }

        .box {
            max-width: 420px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .item {
            text-align: left;
            padding: 5px 0;
        }

        .upi {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: 600;
        }

        button {
            background: #3b2f2f;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6f4e37;
        }

        .order-id {
            font-weight: bold;
            margin-bottom: 10px;
            color: #6f4e37;
        }

        img {
            width: 220px;
            height: 220px;
            margin: 15px auto;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>💳 Secure Checkout</h1>
</header>

<div class="box">

    <div class="order-id" id="orderId"></div>

    <h3>Order Summary</h3>
    <div id="summary"></div>

    <h2 id="total">Total: ₹0</h2>

    <!-- REAL QR -->
    <img id="qr">

    <div class="upi">UPI: dripcafe@upi</div>

    <button onclick="pay()">I Have Paid ✔ Place Order</button>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let summary = document.getElementById("summary");
let total = 0;

// ORDER ID
let orderId = "DRIP-" + Math.floor(1000 + Math.random() * 9000);
document.getElementById("orderId").innerText = "Order ID: " + orderId;

summary.innerHTML = "";

// BUILD SUMMARY
for(let name in cart){
    let item = cart[name];

    if(item.qty > 0){
        let itemTotal = item.qty * item.price;
        total += itemTotal;

        summary.innerHTML += `
            <div class="item">${name} × ${item.qty} = ₹${itemTotal}</div>
        `;
    }
}

document.getElementById("total").innerText = "Total: ₹" + total;

// REAL QR WITH TOTAL
document.getElementById("qr").src =
"https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
encodeURIComponent("upi://pay?pa=dripcafe@upi&pn=DripCafe&am=" + total);

function pay(){
    localStorage.removeItem("cart");
    window.location.href = "preparing.html";
}
</script>

</body>
</html>
