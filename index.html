<!DOCTYPE html>
<html>
<head>
    <title>Drip Cafe</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f5efe6;
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(135deg, #3b2f2f, #6f4e37);
            color: white;
            text-align: center;
            padding: 90px 20px;
        }

        .hero h1 {
            font-size: 52px;
            margin: 0;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* MENU CARD */
        .card {
            background: white;
            margin: 15px auto;
            padding: 15px;
            border-radius: 12px;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        button {
            background: #3b2f2f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #6f4e37;
        }

        .qty {
            font-size: 18px;
            margin: 0 10px;
        }

        .cart-btn {
            text-align: center;
            margin: 25px;
        }
    </style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>☕ DRIP CAFE</h1>
    <p>Fresh Coffee • Cozy Vibes • Daily Brew</p>
</div>

<!-- MENU -->

<div class="card">
    <h3>Espresso ☕</h3>
    <p>₹120</p>
    <button onclick="decrease('Espresso',120)">-</button>
    <span class="qty" id="EspressoQty">0</span>
    <button onclick="increase('Espresso',120)">+</button>
</div>

<div class="card">
    <h3>Cappuccino ☕</h3>
    <p>₹150</p>
    <button onclick="decrease('Cappuccino',150)">-</button>
    <span class="qty" id="CappuccinoQty">0</span>
    <button onclick="increase('Cappuccino',150)">+</button>
</div>

<div class="card">
    <h3>Latte 🥛</h3>
    <p>₹180</p>
    <button onclick="decrease('Latte',180)">-</button>
    <span class="qty" id="LatteQty">0</span>
    <button onclick="increase('Latte',180)">+</button>
</div>

<div class="card">
    <h3>Mocha 🍫</h3>
    <p>₹200</p>
    <button onclick="decrease('Mocha',200)">-</button>
    <span class="qty" id="MochaQty">0</span>
    <button onclick="increase('Mocha',200)">+</button>
</div>

<!-- CART BUTTON -->
<div class="cart-btn">
    <a href="cart.html">
        <button>Go to Cart 🛒</button>
    </a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

function increase(name, price) {
    if (!cart[name]) {
        cart[name] = {price: price, qty: 0};
    }

    cart[name].qty++;

    localStorage.setItem("cart", JSON.stringify(cart));
    document.getElementById(name + "Qty").innerText = cart[name].qty;
}

function decrease(name) {
    if (!cart[name]) return;

    if (cart[name].qty > 0) {
        cart[name].qty--;
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    document.getElementById(name + "Qty").innerText = cart[name].qty;
}
</script>


</body>
</html>
