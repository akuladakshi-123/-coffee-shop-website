<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"> 
</head>

<body>
<header>
    <h1>drip cafe ☕</h1>
    <p>Fresh Coffee, Fresh Start</p>
</header> 
<img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=800"
alt="Coffee"
width="300">

<section>
    <h2>Our Menu</h2>

    <div>
        <h3>Espresso</h3>
        <p>₹120</p>
        <button onclick="addToCart('Espresso',120)">Add to Cart</button>
    </div>

    <div>
        <h3>Cappuccino</h3>
        <p>₹150</p>
        <button onclick="addToCart('Cappuccino',150)">Add to Cart</button>
    </div>

    <div>
        <h3>Latte</h3>
        <p>₹180</p>
        <button onclick="addToCart('Latte',180)">Add to Cart</button>
    </div>
</section>

<section>
    <h2>About Us</h2>
    <p>
        Welcome to drip cafe. We serve freshly brewed coffee
        made with premium beans and lots of passion.
    </p>
</section>
    
<a href="cart.html">
    <button>Go to Cart 🛒</button>
</a>

<p id="message"></p>

<script src="script.js"></script>

<script>
let cart = [];

function addToCart(name, price) {
    cart.push({name, price});
    localStorage.setItem("cart", JSON.stringify(cart));
    alert(name + " added to cart ☕");
}
</script>    
</body>
</html>
