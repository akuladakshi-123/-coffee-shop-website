<!DOCTYPE html>
<html>
<head>
    <title>Drip Cafe</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { margin:0; font-family:Poppins; background:#f5efe6; }

        .hero {
            background: linear-gradient(135deg,#3b2f2f,#6f4e37);
            color:white;
            text-align:center;
            padding:80px 20px;
        }

        .card {
            background:white;
            margin:15px auto;
            padding:15px;
            border-radius:12px;
            max-width:400px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        button {
            background:#3b2f2f;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:8px;
        }

        .qty { margin:0 10px; font-weight:bold; }

        .cart-btn { text-align:center; margin:20px; }
    </style>
</head>

<body>

<div class="hero">
    <h1>☕ DRIP CAFE</h1>
    <p>Fresh Coffee • Cozy Vibes</p>
</div>

<div class="card">
    <h3>Espresso ☕</h3>
    <p>₹120</p>
    <button onclick="dec('Espresso')">-</button>
    <span class="qty" id="EspressoQty">0</span>
    <button onclick="inc('Espresso',120)">+</button>
</div>

<div class="card">
    <h3>Cappuccino ☕</h3>
    <p>₹150</p>
    <button onclick="dec('Cappuccino')">-</button>
    <span class="qty" id="CappuccinoQty">0</span>
    <button onclick="inc('Cappuccino',150)">+</button>
</div>

<div class="card">
    <h3>Latte 🥛</h3>
    <p>₹180</p>
    <button onclick="dec('Latte')">-</button>
    <span class="qty" id="LatteQty">0</span>
    <button onclick="inc('Latte',180)">+</button>
</div>

<div class="card">
    <h3>Mocha 🍫</h3>
    <p>₹200</p>
    <button onclick="dec('Mocha')">-</button>
    <span class="qty" id="MochaQty">0</span>
    <button onclick="inc('Mocha',200)">+</button>
</div>

<div class="cart-btn">
    <a href="cart.html">
        <button>Go to Cart 🛒</button>
    </a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

function inc(name, price){
    if(!cart[name]){
        cart[name] = {price: price, qty: 0};
    }

    cart[name].qty++;

    localStorage.setItem("cart", JSON.stringify(cart));

    document.getElementById(name+"Qty").innerText = cart[name].qty;
}

function dec(name){
    if(!cart[name]) return;

    if(cart[name].qty > 0){
        cart[name].qty--;
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    document.getElementById(name+"Qty").innerText = cart[name].qty;
}
</script>

</body>
</html>
