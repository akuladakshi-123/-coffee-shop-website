<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#4B2E2B;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 60px;
background:#3E2723;
}

.logo{
font-size:48px;
font-family:'Playfair Display',serif;
font-weight:bold;
color:#F5E6D3;
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav a{
text-decoration:none;
color:#F5E6D3;
font-size:18px;
font-weight:500;
}

.hero{
display:flex;
justify-content:space-between;
align-items:center;
padding:80px 60px;
min-height:80vh;
}

.content{
max-width:600px;
}

.content h1{
font-size:70px;
line-height:1.1;
font-family:'Playfair Display',serif;
color:#F5E6D3;
}

.content p{
margin-top:20px;
font-size:22px;
color:#E8D8C4;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
background:#F5E6D3;
color:#3E2723;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

.image img{
width:500px;
max-width:100%;
border-radius:20px;
}

footer{
text-align:center;
padding:25px;
border-top:1px solid #8B6B4A;
color:#F5E6D3;
}

@media(max-width:900px){

header{
flex-direction:column;
gap:20px;
}

.hero{
flex-direction:column;
text-align:center;
}

.content h1{
font-size:48px;
}

.image{
margin-top:40px;
}

.image img{
width:320px;
}
}

</style>
</head>

<body>

<header>

<div class="logo">☕ DRIP CAFE</div>

<nav>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="menu.html">Menu</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>

</header>

<section class="hero">

<div class="content">

<h1>Every Moment<br>Has Its Flavour.</h1>

<p>
Discover hand-crafted coffee made with passion and premium beans.
Experience warmth, aroma and unforgettable taste at Drip Cafe.
</p>

<a href="menu.html" class="btn">Explore Menu</a>

</div>

<div class="image">

<img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=900" alt="Coffee">

</div>

</section>

<footer>

© 2026 DRIP CAFE | Every Moment Has Its Flavour ☕

</footer>

</body>
</html>
