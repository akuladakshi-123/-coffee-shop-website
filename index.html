<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffeea</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2efe9;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:30px 80px;
}

.logo{
font-size:30px;
font-weight:bold;
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav a{
text-decoration:none;
color:black;
font-size:18px;
}

.signup{
background:black;
color:white;
padding:12px 30px;
border:none;
border-radius:30px;
cursor:pointer;
}

.hero{
display:flex;
justify-content:space-between;
align-items:center;
padding:80px;
min-height:80vh;
}

.content{
max-width:600px;
}

.content h1{
font-size:70px;
line-height:1.1;
margin-bottom:20px;
}

.content p{
font-size:22px;
color:#444;
margin-bottom:20px;
}

.order{
background:black;
color:white;
padding:15px 40px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

.image img{
width:450px;
}

footer{
padding:20px 80px;
}

hr{
margin-top:40px;
margin-bottom:20px;
}

@media(max-width:900px){

header{
flex-direction:column;
gap:20px;
}

.hero{
flex-direction:column;
text-align:center;
}

.content h1{
font-size:45px;
}

.image img{
width:300px;
margin-top:30px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">☕ coffeea</div>

<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Menu</a></li>
<li><a href="#">About Us</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<button class="signup">Sign Up</button>
</header>

<section class="hero">

<div class="content">
<h1>Brewed with Love.<br>Served with Warmth.</h1>

<p>
Discover hand-crafted coffee made with locally sourced beans and heart.
</p>

<p>⭐ 4.9 stars from 500+ reviews</p>

<button class="order">Order Now</button>
</div>

<div class="image">
<img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800" alt="Coffee">
</div>

</section>

<footer>
<hr>
<p>Follow us on Instagram • Twitter • Facebook</p>
</footer>

</body>
</html>
