<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drip Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#efede7;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
}

header{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:30px 80px;
}

.logo{
    font-size:32px;
    font-weight:700;
    font-family:'Playfair Display',serif;
}

nav ul{
    display:flex;
    list-style:none;
    gap:35px;
}

nav a{
    text-decoration:none;
    color:#111;
    font-size:18px;
    font-weight:500;
}

nav a:hover{
    border-bottom:2px solid #111;
}

.hero{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:50px 80px;
}

.content{
    max-width:650px;
}

.content h1{
    font-family:'Playfair Display',serif;
    font-size:78px;
    line-height:1.1;
    color:#111;
}

.content p{
    margin-top:25px;
    font-size:22px;
    color:#444;
    line-height:1.6;
}

.rating{
    margin-top:25px;
    color:#666;
    font-size:17px;
}

.order-btn{
    margin-top:30px;
    background:#000;
    color:#fff;
    border:none;
    padding:15px 45px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.order-btn:hover{
    transform:translateY(-3px);
}

.image img{
    width:500px;
    max-width:100%;
}

footer{
    padding:20px 80px;
}

.line{
    width:100%;
    height:1px;
    background:#777;
    margin-bottom:20px;
}

.social{
    display:flex;
    gap:20px;
    color:#444;
}

@media(max-width:900px){

header{
    flex-direction:column;
    gap:20px;
}

nav ul{
    gap:20px;
}

.hero{
    flex-direction:column;
    text-align:center;
}

.content h1{
    font-size:50px;
}

.image{
    margin-top:40px;
}

.image img{
    width:320px;
}
}

</style>
</head>

<body>

<header>

<div class="logo">☕ Drip Cafe</div>

<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Menu</a></li>
<li><a href="#">About Us</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

</header>

<section class="hero">

<div class="content">

<h1>Every Moment<br>Has Its Flavour.</h1>

<p>
Discover hand-crafted coffee, made with locally sourced beans and passion. Enjoy every sip, every conversation, and every moment at Drip Cafe.
</p>

<div class="rating">
⭐ 4.9 stars from 500+ reviews
</div>

<button class="order-btn">Order Now</button>

</div>

<div class="image">
<img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=900" alt="Coffee">
</div>

</section>

<footer>

<div class="line"></div>

<div class="social">
<span>Instagram</span>
<span>Twitter</span>
<span>Facebook</span>
</div>

</footer>

</body>
</html>
